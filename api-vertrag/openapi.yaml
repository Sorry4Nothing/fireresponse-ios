        Setzt ein neues Startpasswort (7 Tage gültig), beendet alle Sitzungen des Kontos (und löscht damit seine Push-Tokens) und verlangt beim nächsten Login einen Passwortwechsel. Die Antwort enthält das Startpasswort einmal; es lässt sich danach mit `GET` wieder anzeigen, solange es offen ist.

