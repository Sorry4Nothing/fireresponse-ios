        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    KeineBerechtigung403:
      description: Keine Berechtigung (code KEINE_BERECHTIGUNG); bei ändernden Methoden auch, wenn der Origin-Header einer fremden Herkunft angehört
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    NichtGefunden404:
      description: Nicht gefunden (code NICHT_GEFUNDEN); auch für Objekte einer anderen Einheit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    AppVeraltet426:
      description: App-Version unter dem Minimum (code APP_VERALTET)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
    AdminKonflikt409:
