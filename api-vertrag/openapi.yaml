  /api/v1/datenschutz:
    get:
      operationId: datenschutzLesen
      summary: Datenschutzerklärung als strukturierter Text
      tags:
        - Allgemein
      security: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Öffentlich, ohne Anmeldung und ohne Sitzung; die App zeigt den Text vor der Einwilligung. Alle Personen erhalten 200.
        Der Inhalt stammt aus derselben Quelle wie die HTML-Seite `GET /datenschutz` (ein Test vergleicht beide): gleiche Abschnitte,
        gleiche Reihenfolge, gleiche Fassung. Die verantwortliche Stelle und ihre E-Mail-Adresse sind wie dort eingesetzt.
        `version` ist die Fassung der Einwilligung (`EINWILLIGUNG_VERSION`), dieselbe wie bei `GET /api/v1/einwilligung`.
        Der erste Abschnitt trägt den Titel der Erklärung und den Hinweis zum Entwurfsstand.
        Cache: `Cache-Control: public, max-age=3600`. Drosselung: 30 Anfragen je Minute und Adresse, gemeinsam mit den Seiten (429, siehe `X-App-Version`).
        Die Prüfung der App-Version gilt wie überall unter `/api/*`: Ist `X-App-Version` älter als der Mindeststand, antwortet die Route mit 426.

        Statuscodes: 200, 426, 429.
      responses:
        "200":
          description: Fassung und Abschnitte.
          headers:
            Cache-Control:
              description: "`public, max-age=3600`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Datenschutz"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
