        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminZeitregelId"
      responses:
        "204":
          description: Gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/termine:
    get:
      operationId: holeAdminTermine
      summary: Termine der Einheit für die Verwaltung
      description: |
        Kantonsadmin, Kommandant und Stellvertretungen der Einheit. Liefert die synchronisierten Termine der Einheit, die den Zeitraum `von` bis `bis` (Schweizer Kalendertage, einschliesslich) berühren, nach Beginn sortiert. Titel, Zeit und Art gehören dem Lodur-Sync; der Schalter `nurLeitende` gehört der Verwaltung.

        Statuscodes: 200 bei Erfolg. 400 bei fehlendem oder ungültigem Zeitraum. 403 für Leitende und Eltern der Einheit (und ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`); 404, wenn die Einheit unbekannt oder unsichtbar ist.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - name: von
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: bis
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Die Termine des Zeitraums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTermine"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/termine/{id}:
    put:
      operationId: setzeAdminTerminNurLeitende
      summary: Termin auf «nur Leitende» stellen oder wieder freigeben
      description: |
        Kantonsadmin, Kommandant und Stellvertretungen der Einheit. «Nur Leitende» versteckt den Termin vor Eltern und Teilnehmenden (Liste, Detail, Push, Erinnerung, Auswertung); Kantonsadmin, Kommando, Stellvertretung und Leitende der Einheit sehen ihn weiter. Der Sync überschreibt den Schalter nie. Eine Änderung steht im Audit-Log (`termin_sichtbarkeit_geaendert`); derselbe Wert ändert nichts.

        Statuscodes: 200 bei Erfolg. 400 bei ungültigem Body. 403 für Leitende und Eltern. 404 bei unbekannter oder unsichtbarer Einheit und bei einem Termin einer anderen Einheit.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - name: id
          in: path
          required: true
          description: ID des Termins (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nurLeitende]
              properties:
                nurLeitende:
                  type: boolean
      responses:
        "200":
          description: Gespeichert.
          content:
            application/json:
              schema:
                type: object
                required: [id, nurLeitende]
                properties:
                  id:
                    type: string
                    format: uuid
                  nurLeitende:
                    type: boolean
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/lodur:
    get:
      operationId: holeAdminLodurLink
      summary: Stand des Lodur-Links der Einheit
      description: |
        Kantonsadmin, Kommandant und Stellvertretungen der Einheit. Liefert, ob ein Link gesetzt ist, ihn maskiert (nur der Host) und den Stand des Syncs. Der Link selbst kommt nie zurück.

        Statuscodes: 200 bei Erfolg. 403 für Leitende und Eltern der Einheit (und ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`); 404, wenn die Einheit unbekannt oder unsichtbar ist.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "200":
          description: Stand des Links und des Syncs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLodurStand"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    put:
      operationId: setzeAdminLodurLink
      summary: Lodur-Link der Einheit setzen
      description: |
        Kantonsadmin, Kommandant und Stellvertretungen der Einheit. Speichert den ganzen Link verschlüsselt (AES-GCM) und ersetzt einen bisherigen. Der Stand des Syncs beginnt von vorn, und die API ruft den Kalender sofort ab, bevor sie antwortet (bis zu 15 Sekunden je Abruf): Die Antwort zeigt `syncOkAm` bei Erfolg oder den Code in `syncFehler`; der Link bleibt in beiden Fällen gespeichert. Danach holt der Lauf alle 15 Minuten den Kalender. Es gibt keinen weiteren manuellen Auslöser. Das Setzen steht im Audit-Log, ohne den Link.

        Der Link ist die öffentliche Terminliste der Einheit in Lodur (`…/index.php?modul=13&what=10&year=2026`, eine HTML-Tabelle). Er bleibt, wie eingegeben; der Sync setzt `year` bei jedem Abruf selbst: das laufende Jahr, ab Oktober auch das nächste (ein Fehler dort lässt den Lauf nicht scheitern). Ein ICS-Kalender (`text/calendar`) wird weiter gelesen, hat aber keine Art und damit keine Anmeldung.

        Der Link muss `https` sein, ohne Port und ohne Zugangsdaten (`@`), und sein Host muss in `LODUR_ERLAUBTE_HOSTS` stehen (SR-26); dasselbe gilt für jeden Link, den der Sync daraus ableitet. Die Antwort wiederholt den Link nie.

        Statuscodes: 200 bei Erfolg. 400 bei ungültigem Body oder ungültigem Link (Code `LODUR_LINK_UNGUELTIG`). 403 für Leitende und Eltern. 404 bei unbekannter oder unsichtbarer Einheit.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLodurSetzen"
      responses:
        "200":
          description: Link gespeichert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLodurStand"
        "400":
          description: Ungültiger Body, oder der Link ist ungültig oder sein Host nicht erlaubt.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Fehler"
                  - $ref: "#/components/schemas/AdminLodurLinkUngueltig"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheAdminLodurLink
      summary: Lodur-Link der Einheit entfernen
      description: |
        Kantonsadmin, Kommandant und Stellvertretungen der Einheit. Entfernt den Link und den Stand des Syncs. Die Termine bleiben; es kommen keine neuen. Das Entfernen steht im Audit-Log.

        Statuscodes: 204 bei Erfolg (auch ohne gesetzten Link). 403 für Leitende und Eltern. 404 bei unbekannter oder unsichtbarer Einheit.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "204":
          description: Entfernt.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/auswertung/filter:
    get:
      operationId: auswertungFilter
      summary: Bezirke und Einheiten für die Filter der Auswertung
      tags:
        - Verwaltung
      description: |
        Die Einheiten, die die Person auswerten darf, und ihre Bezirke: Kommandant/in und Stellvertretung die eigenen, das Kantonsadmin-Konto alle (`umschalter: true`, dann schaltet die Verwaltung zwischen Bezirken und Einheiten um).

        Statuscodes: 200, 401, 403 (Leitende, Eltern und Teilnehmende; ohne zweiten Faktor mit Code `ZWEITER_FAKTOR_FEHLT`), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Auswahl für die Filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuswertungFilter"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/auswertung/termine:
    get:
      operationId: auswertungTermine
      summary: Termine eines Zeitraums mit den Zahlen der Anmeldungen
      tags:
        - Verwaltung
      description: |
        Alle Programme, die im Zeitraum beginnen (Schweizer Kalendertag des Beginns, ein Lager zählt an seinem ersten Tag), mit Ja, Nein und Offen für Teilnehmende und Leitende. Abgesagte Termine sind enthalten (`status`), zählen aber nicht in die Quote. `begonnen` sagt, ob der Beginn vorbei ist. Sortiert nach Beginn.

        Es zählen nur aktive Teilnehmende und aktive Konten; die Zahlen enthalten nie Namen, Konten oder Eltern. Grundlage sind die Anmeldungen, nie eine Präsenzkontrolle.

        Statuscodes: 200, 400 (Zeitraum fehlt, verkehrt, über 366 Tage, unbekannter Parameter), 401, 403, 404 (`einheitId` unbekannt oder unsichtbar), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AuswertungVon"
        - $ref: "#/components/parameters/AuswertungBis"
        - $ref: "#/components/parameters/AuswertungBezirk"
        - $ref: "#/components/parameters/AuswertungEinheit"
        - $ref: "#/components/parameters/AuswertungRolle"
      responses:
        "200":
          description: Termine mit Zahlen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuswertungTermine"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/auswertung/termine/{id}:
    get:
      operationId: auswertungPraesenzliste
      summary: Präsenzliste eines Termins
      tags:
        - Verwaltung
      description: |
        Ja, Nein und Offen für jede aktive teilnehmende Person und jede Person mit Rolle in der Einheit, Teilnehmende und Leitende getrennt, mit den Zahlen je Gruppe. Das ist die Liste der Anmeldungen, keine Anwesenheit. Ohne Antwort gilt `offen`.

        Statuscodes: 200, 400, 401, 403 (kein Recht in der Einheit des Termins), 404 (Termin unbekannt oder in keiner sichtbaren Einheit), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      responses:
        "200":
          description: Präsenzliste.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuswertungPraesenzliste"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/auswertung/quoten:
    get:
      operationId: auswertungQuoten
      summary: Teilnahmequote pro Person im Zeitraum
      tags:
        - Verwaltung
      description: |
        Eine Zeile je Person und Einheit: Termine, Ja, Nein, Offen und Quote (`ja` geteilt durch `termine`, drei Stellen, `null` ohne Termine). Teilnehmende und Leitende stehen in einer Liste (`art`); `rolle` filtert.

        Bezug sind aktive Programme, die im Zeitraum beginnen und schon begonnen haben: Bei künftigen Terminen sagt «offen» noch nichts, abgesagte zählen nicht. Inaktive Teilnehmende und deaktivierte Konten fehlen. Die Zahlen hängen an der Person, nicht am antwortenden Konto: Ein Wechsel von den Eltern aufs Kind ändert sie nicht. Eine Person zählt für alle Termine des Zeitraums, auch für die vor ihrem Eintritt (es gibt kein Eintrittsdatum).

        Statuscodes: 200, 400, 401, 403, 404 (`einheitId` unbekannt oder unsichtbar), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AuswertungVon"
