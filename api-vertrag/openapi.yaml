                  properties:
                    monat:
                      type: integer
                      minimum: 1
                      maximum: 12
                    termine:
                      type: integer
                    teilnehmende:
                      oneOf:
                        - $ref: "#/components/schemas/AuswertungZahlen"
                        - type: "null"
                    leitende:
                      oneOf:
                        - $ref: "#/components/schemas/AuswertungZahlen"
                        - type: "null"
    AuswertungPerson:
      type: object
      required: [person, von, bis, zahlen, termine]
      properties:
        person:
          type: object
          required: [id, name, art, rolle, einheit]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            art:
              type: string
              enum: [teilnehmende, leitende]
            rolle:
              type: [string, "null"]
              enum: [kommandant, stellvertretung, leitung, null]
            einheit:
              $ref: "#/components/schemas/AuswertungEinheitKurz"
        von:
          type: string
          format: date
        bis:
          type: string
          format: date
        zahlen:
          allOf:
            - $ref: "#/components/schemas/AuswertungZahlen"
            - type: object
              required: [termine]
              properties:
                termine:
                  type: integer
        termine:
          type: array
          description: Programme im Bezug, nach Beginn.
          items:
            type: object
            required: [id, titel, ganztaegig, beginn, tagVon, antwort]
            properties:
              id:
                type: string
                format: uuid
              titel:
                type: string
              ganztaegig:
                type: boolean
              beginn:
                type: [string, "null"]
                format: date-time
              tagVon:
                type: [string, "null"]
                format: date
              antwort:
                type: string
                enum: [ja, nein, offen]
    AdminBezirkAnlegen:
      type: object
      required: [name]
