        termine:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AuswertungTerminKopf"
              - type: object
                required: [teilnehmende, leitende]
                properties:
                  teilnehmende:
                    oneOf:
                      - $ref: "#/components/schemas/AuswertungZahlen"
                      - type: "null"
                  leitende:
                    oneOf:
                      - $ref: "#/components/schemas/AuswertungZahlen"
                      - type: "null"
    AuswertungPraesenzliste:
      type: object
      required: [termin, zahlen, teilnehmende, leitende]
      properties:
        termin:
          $ref: "#/components/schemas/AuswertungTerminKopf"
        zahlen:
          type: object
          required: [teilnehmende, leitende]
          properties:
            teilnehmende:
              $ref: "#/components/schemas/AuswertungZahlen"
            leitende:
              $ref: "#/components/schemas/AuswertungZahlen"
        teilnehmende:
          type: array
          description: Aktive Teilnehmende, nach Nachname und Vorname.
          items:
            type: object
            required: [id, vorname, nachname, status]
            properties:
              id:
                type: string
                format: uuid
              vorname:
                type: string
              nachname:
                type: string
              status:
                type: string
                enum: [ja, nein, offen]
        leitende:
          type: array
          description: Aktive Konten mit Rolle in der Einheit, Kommandant/in zuerst.
          items:
            type: object
            required: [id, name, rolle, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              rolle:
                type: string
                enum: [kommandant, stellvertretung, leitung]
              status:
                type: string
                enum: [ja, nein, offen]
    AuswertungQuoten:
      type: object
      required: [von, bis, personen]
      properties:
        von:
          type: string
          format: date
        bis:
          type: string
          format: date
        personen:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AuswertungZahlen"
              - type: object
                required: [art, id, name, rolle, rang, einheit, termine]
                properties:
                  art:
                    type: string
                    enum: [teilnehmende, leitende]
                  id:
                    type: string
                    format: uuid
                    description: ID der teilnehmenden Person oder des Kontos.
                  name:
                    type: string
                  rolle:
                    type: [string, "null"]
                    enum: [kommandant, stellvertretung, leitung, null]
                  rang:
                    description: Rang der Person; `null` ohne Rang.
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/AdminRangAnzeige"
                  einheit:
                    $ref: "#/components/schemas/AuswertungEinheitKurz"
                  termine:
                    type: integer
                    description: Programme im Bezug; Summe aus ja, nein und offen.
    AuswertungJahr:
      type: object
      required: [jahr, einheiten]
      properties:
        jahr:
          type: integer
        einheiten:
          type: array
          items:
            type: object
            required:
              [einheit, termine, kommend, teilnehmende, leitende, monate]
            properties:
              einheit:
                allOf:
                  - $ref: "#/components/schemas/AuswertungEinheitKurz"
                  - type: object
                    required: [bezirk]
                    properties:
                      bezirk:
                        type: object
                        required: [id, name]
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
              termine:
