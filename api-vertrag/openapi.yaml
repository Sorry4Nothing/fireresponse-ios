      description: |
        Speichert Zeitpunkt und aktuelle Version der Einwilligung am eigenen Konto. Kein Body: Die Fassung setzt der Server,
        nicht die App. Ein zweiter Aufruf schreibt Zeitpunkt und Version neu.

        Statuscodes: 204, 401, 403 (Pflichtwechsel des Passworts offen), 426.
      responses:
        "204":
          description: Gespeichert; kein Body.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/admin/einheiten/{einheitId}:
    delete:
      operationId: loescheAdminEinheit
      summary: Einheit löschen
      tags:
        - Verwaltung
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Gelöscht wird nur eine leere Einheit: Das Kommando zählt nicht als Inhalt, sein Konto geht mit, sofern es zu keiner anderen Einheit gehört und nicht für eine teilnehmende Person antwortet. Hat die Einheit Teilnehmende, Programme, Zeitregeln oder weitere Rollen, ist die Antwort 409 `EINHEIT_BELEGT`.
        Das Löschen steht im Audit-Log.

        Statuscodes: 204, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: einheitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Einheit gelöscht.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/kommando:
    post:
      operationId: kommandoUebergeben
      summary: Das Kommando einer Einheit übergeben
      tags:
        - Verwaltung
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Eine bestehende aktive Person wird neue Kommandantin oder neuer Kommandant;
        die bisherige Person bekommt die Rolle aus `bisherigeRolle` (Stellvertretung an einer Position, Leitung oder keine).
        Alles geschieht in einer Transaktion: Die Einheit ist nie ohne Kommandanten und nie mit zwei. Bei einer Stellvertretung rücken
        die Stellvertretungen ab dieser Position um eins nach hinten. Rang und Reihenfolge bleiben bei der jeweiligen Person.
        Die Übergabe steht im Audit-Log (ohne Namen).

        Reihenfolge der Prüfung: Eingabe (400); Einheit unbekannt oder für das Konto unsichtbar (404); kein Kantonsadmin (403);
        neue Person unbekannt, deaktiviert oder selbst Kantonsadmin (400); dieselbe Person wie bisher (409 `GLEICHE_PERSON`).
        Ohne zweiten Faktor sperrt die Verwaltung jedes Konto mit Verwaltungsrolle (403 `ZWEITER_FAKTOR_FEHLT`).

        Statuscodes: 204, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KommandoUebergabe"
      responses:
        "204":
          description: Übergeben. Kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Dieselbe Person ist schon Kommandantin oder Kommandant (`GLEICHE_PERSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/zeitregeln:
    get:
      operationId: listeAdminZeitregeln
      summary: Erinnerungsregeln der Einheit
      description: |
        Kommando der Einheit und Kantonsadmin. Liefert alle Regeln der Einheit, sortiert nach Abstand (grösster zuerst) und Uhrzeit.

        Der Server prüft die Regeln jede Minute und schickt die Erinnerung an Konten mit offener Antwort, nur für Programme im Anmeldefenster (`ANMELDEFENSTER_TAGE`), die noch nicht begonnen haben.

        Statuscodes: 200 bei Erfolg. 403 für Leitende und Eltern der Einheit (und ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`); 404, wenn die Einheit unbekannt oder unsichtbar ist.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "200":
          description: Regeln der Einheit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminZeitregelListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeAdminZeitregelAn
      summary: Erinnerungsregel anlegen
      description: |
        Kommando der Einheit und Kantonsadmin. Legt eine Regel an, die Konten ohne gespeichertes «ja» oder «nein» an ein Programm erinnert. Der Server prüft jede Minute, ob eine Regel fällig ist: Die Auslösezeit pro Programm ist der Tag des Beginns minus `tageVorher` Kalendertage, zur Uhrzeit (Schweizer Zeit). Liegt sie nach dem Beginn (0 Tage und späte Uhrzeit), gibt es für dieses Programm keine Erinnerung. Pro Regel und Programm geht höchstens eine Erinnerung hinaus; eine Regel, die erst nach der Auslösezeit entsteht, holt sie bis zum Programmbeginn nach. Das Anlegen steht im Audit-Log (ohne den Text).

        Statuscodes: 201 bei Erfolg. 400 bei ungültiger Eingabe. 403 für Leitende und Eltern. 404 bei unbekannter oder unsichtbarer Einheit.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminZeitregelAnlegen"
      responses:
        "201":
          description: Regel angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/zeitregeln/{id}:
    patch:
      operationId: aendereAdminZeitregel
      summary: Erinnerungsregel ändern
      description: |
        Kommando der Einheit und Kantonsadmin, nur Regeln der Einheit im Pfad. Alle Felder sind optional; ein leeres Objekt ist ein No-op und liefert 204. Eine Änderung steht im Audit-Log (welche Felder, ohne den Text). Eine schon gesendete Erinnerung wird durch eine Änderung nie wiederholt.

        Reihenfolge der Prüfungen: Pfad und Body (400), dann Einheit sichtbar (404) und Recht (403), dann Regel in dieser Einheit (404).

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger Eingabe. 403 für Leitende und Eltern. 404, wenn die Einheit oder die Regel unbekannt ist oder zu einer anderen Einheit gehört.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminZeitregelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminZeitregelAendern"
      responses:
        "204":
          description: Geändert (auch bei einem No-op).
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: loescheAdminZeitregel
      summary: Erinnerungsregel löschen
      description: |
        Kommando der Einheit und Kantonsadmin, nur Regeln der Einheit im Pfad. Löscht die Regel samt dem Vermerk der gesendeten Erinnerungen; das Löschen steht im Audit-Log.

        Statuscodes: 204 bei Erfolg. 400 bei ungültiger ID. 403 für Leitende und Eltern. 404, wenn die Einheit oder die Regel unbekannt ist oder zu einer anderen Einheit gehört.
      tags:
        - Verwaltung
      parameters:
