openapi: 3.1.0
info:
  title: FireResponse API
  version: 1.0.0
  description: Schnittstelle des Backends für die nativen Apps (Android, iOS). Sie beschreibt, was der Code in apps/api tatsächlich liefert; test/openapi.test.ts vergleicht Pfade und Methoden mit den Routen der App.
servers:
  - url: https://api.example.org
    description: Platzhalter; die echte Adresse steht in der Konfiguration der App
security:
  - sitzung: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gesundheitsprüfung
      tags:
        - Allgemein
      security: []
      description: |
        Öffentlich, ohne Anmeldung, ausserhalb der Versionsprüfung (kein `X-App-Version` nötig).
        Antwortet «ok» (200), wenn die Datenbank erreichbar ist. Sonst «fehler» mit 503. Für Überwachung, nicht für die App.
        Schlägt auch Alarm, wenn der Lodur-Sync einer Einheit mit Link seit über 60 Minuten nicht gelungen ist (vier Läufe): «sync-veraltet» mit 503. Vor dem ersten Erfolg zählt der Zeitpunkt, an dem der Link eingetragen wurde. Welche Einheit betroffen ist, steht nur in der Verwaltung (`syncFehler`), nie in dieser Antwort.
      responses:
        "200":
          description: Alles in Ordnung.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ok
        "503":
          description: Datenbank nicht erreichbar.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - fehler
                  - sync-veraltet
  /datenschutz:
    get:
      operationId: getDatenschutzSeite
      summary: Datenschutzerklärung als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite für die App-Stores, ohne Anmeldung und ausserhalb der Versionsprüfung.
        Alle Personen (auch deaktivierte und nicht angemeldete) erhalten 200.
        Die Seite nennt die Datenkategorien (erzeugt aus `datenkategorien.ts`), Empfänger, Fristen und Rechte; die verantwortliche Stelle
        und ihre E-Mail-Adresse setzt der Server aus `VERANTWORTLICHE_STELLE` und `KONTAKT_EMAIL` ein.
        Sie trägt die Fassung der Einwilligung (`EINWILLIGUNG_VERSION`) und ist ein Entwurf, bis der Verantwortliche sie freigibt.
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /konto-loeschen:
    get:
      operationId: getKontoLoeschenSeite
      summary: Hinweis zum Löschen des Kontos als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite für die App-Stores, ohne Anmeldung und ausserhalb der Versionsprüfung.
        Die Person löscht ihr Konto nicht selbst; die App bietet keine Löschung an und `/api/v1` hat keine Route dafür.
        Die Seite nennt den Weg über das Kommando: Auf Anfrage löscht die Leitung Daten, die Anfrage geht an das Kommando
        oder an die Kontaktadresse (`KONTAKT_EMAIL`). Die Verwaltung löscht das Konto (`DELETE /api/v1/admin/konten/{userId}`)
        und die Seite sagt, was gelöscht wird und was bleibt.
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /support:
    get:
      operationId: getSupportSeite
      summary: Support-Seite als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite für die App-Stores, ohne Anmeldung und ausserhalb der Versionsprüfung.
        Nennt die Kontaktadresse (`KONTAKT_EMAIL`) und wer bei was hilft: Fragen zu Terminen und Konto zuerst das Kommando, technische Probleme die Kontaktadresse.
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /admin:
    get:
      operationId: getAdminSeite
      summary: Verwaltung im Browser als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Statische Hülle der Web-Verwaltung, ohne Anmeldung und ausserhalb der Versionsprüfung. Sie enthält keine Daten:
        Die Seite meldet sich über `/api/auth/*` an und ruft danach `/api/v1/admin/*` auf, mit dem Session-Cookie
        und dem zweiten Faktor wie in der App. Alle Personen (auch nicht angemeldete) erhalten 200.

        Die Antwort trägt eine strenge `Content-Security-Policy` (`script-src 'self'`, `style-src 'self'`,
        `frame-ancestors 'none'`), `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`,
        `X-Frame-Options: DENY` und `Cache-Control: no-store`. Skripte und Stilvorlage liegen unter
        `/admin/<Datei>` und tragen dieselben Kopfzeilen (mit `Cache-Control: no-cache`).
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
