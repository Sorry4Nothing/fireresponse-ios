      description: |
        Nur Kommando der Einheit und Kantonsadmin. Befördert eine Leitung zur Stellvertretung (`stellvertretung`, ans Ende der Reihenfolge) oder stuft eine Stellvertretung zur Leitung zurück (`leitung`). Konto, Rang und Telefon bleiben. Die Position ändert das Ordnen der Stellvertretungen. Der Wechsel steht im Audit-Log.
        Das Kommando wechselt nur über die Übergabe (409 `ROLLE_KOMMANDO`); dieselbe Rolle ist 409 `ROLLE_GLEICH`.

