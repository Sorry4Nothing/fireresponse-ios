        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /nutzungsbedingungen:
    get:
      operationId: getNutzungsbedingungenSeite
      summary: Nutzungsbedingungen mit Auftragsbearbeitung als HTML-Seite
      tags:
        - Allgemein
      security: []
      description: |
        Öffentliche Seite, ohne Anmeldung und ausserhalb der Versionsprüfung. Alle Personen erhalten 200.
        Die Bezirke stimmen den Bedingungen und der Auftragsbearbeitung durch die Nutzung zu; die Seite sagt es und nennt, dass der
        Kantonsadmin die Daten aller Bezirke sieht. Betreiber und Adresse setzt der Server wie bei `GET /datenschutz` ein.
        Die Fassung ist dieselbe wie die der Einwilligung; die Seite ist ein Entwurf, bis der Verantwortliche sie freigibt.
      responses:
        "200":
          description: HTML-Seite (`text/html; charset=UTF-8`).
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/personen/{id}/bild:
    get:
      operationId: adminPersonBildLesen
      summary: Profilbild einer Person für die Verwaltung lesen
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID der Person.
          schema:
            type: string
            format: uuid
      description: |
        Dasselbe Bild wie `GET /api/v1/personen/{id}/bild`, mit denselben Rollen, demselben Cache-Header und derselben Antwort 404 für alle,
        die es nicht sehen. Der Unterschied: Unter `/admin/` gilt die Einwilligung in die App nicht, dafür der zweite Faktor
        (Kommando, Stellvertretung und Kantonsadmin ohne zweiten Faktor: 403). Die Verwaltung ruft diese Adresse auf.
        Statuscodes: 200, 400, 401, 403, 404, 426.
      responses:
        "200":
          description: Das Bild.
          headers:
            Cache-Control:
              description: Immer `private, no-store`.
              schema:
                type: string
                const: private, no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/admin/konten:
    get:
      operationId: sucheAdminKonto
      summary: Ein Konto nach Benutzername suchen
      tags:
        - Verwaltung
      description: |
        Für die Rückfrage vor dem Löschen: Name, Benutzername und die Einheiten, in denen das Konto vorkommt, mit seiner Rolle dort
        (Kommandant, Stellvertretung, Leitung, Eltern oder Teilnehmende mit eigenem Konto). Kommando und Stellvertretungen sehen nur
        die Einheiten, die sie selbst sehen; der Kantonsadmin sieht alle. Der Benutzername gilt ohne Rücksicht auf Gross- und Kleinschreibung.

        Reihenfolge der Prüfung: Query (400); Konto unbekannt oder in keiner Einheit sichtbar (404); sichtbar, aber in keiner Einheit
        verwaltet (403). Ein Konto ohne jede Einheit sieht nur der Kantonsadmin.
        Ohne zweiten Faktor sperrt die Verwaltung jedes Konto mit Verwaltungsrolle (403 `ZWEITER_FAKTOR_FEHLT`).

        Statuscodes: 200, 400, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: benutzername
          in: query
          required: true
          description: Benutzername des gesuchten Kontos, 1 bis 64 Zeichen.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Das Konto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KontoSuche"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/konten/{userId}:
    delete:
      operationId: loescheAdminKonto
      summary: Ein Konto endgültig löschen
      tags:
        - Verwaltung
      description: |
        Die Person löscht ihr Konto nicht selbst; die App bietet es nicht an. Es löscht die Verwaltung: der Kantonsadmin jedes Konto,
        Kommandantin oder Kommandant und Stellvertretungen ein Konto, dessen Einheiten sie alle verwalten (Stellvertretungen entfernt nur
        das Kommando). Kommt das Konto auch in einer Einheit vor, die sie nicht verwalten, löscht es nur der Kantonsadmin.

        Das Löschen entfernt in einer Transaktion Konto, Anmeldung, Sitzungen, zweiten Faktor, Push-Tokens, Profilbild, Rollen in Einheiten,
        Verknüpfungen zu teilnehmenden Personen und Anmeldungen der Leitung. Teilnehmende Personen, Programme und ihre Anmeldungen bleiben;
        der Verweis auf die löschende Person (`geaendertVon`) wird leer. Im Audit-Log bleibt ein Eintrag `konto_geloescht` mit der ID des
        Kontos und der des Akteurs, ohne Namen. Die Sitzungen enden sofort mit 401. Backups behalten das Konto bis zum Ablauf ihrer Aufbewahrung.

        Reihenfolge der Prüfung: Pfad (400); Konto unbekannt oder in keiner Einheit sichtbar (404); fehlendes Recht, ein Admin-Konto
        für Nicht-Admins oder eine Einheit ausserhalb der verwalteten (403); das eigene Konto (409 `EIGENES_KONTO`); Kommandantin oder
        Kommandant einer Einheit (409 `KOMMANDANT`, zuerst das Kommando übergeben).
        Ohne zweiten Faktor sperrt die Verwaltung jedes Konto mit Verwaltungsrolle (403 `ZWEITER_FAKTOR_FEHLT`).

        Statuscodes: 204, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/KontoIdPfad"
      responses:
        "204":
          description: Gelöscht. Kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: Das eigene Konto oder ein Kommando (`EIGENES_KONTO`, `KOMMANDANT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKonflikt"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /admin/konto-loeschen.js:
    get:
      operationId: getAdminKontoLoeschenSkript
      summary: Skript der Verwaltung – Bereich Konto löschen
      tags:
        - Allgemein
      security: []
      description: Statische Datei der Verwaltung (siehe `GET /admin`), ohne Anmeldung.
      responses:
        "200":
          description: Datei (`text/javascript; charset=UTF-8`).
          content:
            text/javascript:
              schema:
                type: string
components:
  schemas:
    Fehler:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - NICHT_ANGEMELDET
        message:
          type: string
          examples:
            - Nicht angemeldet
    AuthAnmeldungAnfrage:
      type: object
      description: Zugangsdaten. Weitere Felder von better-auth (`rememberMe`, `callbackURL`) verwendet die App nicht.
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: |
            Benutzername. Erlaubt sind Buchstaben, Ziffern, Punkt, Unterstrich und Bindestrich (3 bis 64 Zeichen);
            Gross-/Kleinschreibung ist egal, gespeichert wird kleingeschrieben. Ein Wert ausserhalb der Regel
            ergibt wie jeder Fehlschlag 401.
          example: vorname.nachname
        password:
          type: string
          description: Passwort oder Startpasswort. Bei offenem Startpasswort zählen Gross-/Kleinschreibung, Bindestriche und Leerzeichen nicht.
    AuthBenutzer:
      type: object
      description: |
        Person aus better-auth. Die E-Mail-Adresse ist ein Platzhalter (`…@benutzer.invalid`) und nicht für die
        Anzeige gedacht. Weitere Felder (z. B. Bremsfelder, `createdAt`, `emailVerified`) können vorkommen;
        die App ignoriert sie. Das vollständige Profil liefert `GET /api/v1/ich`.
      required:
        - id
        - name
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Anzeigename.
        username:
          type:
            - string
            - "null"
          description: Benutzername, kleingeschrieben.
        role:
          type:
            - string
            - "null"
          description: Rolle der Person bei better-auth; `admin` für Admins.
          example: admin
        twoFactorEnabled:
          type:
            - boolean
            - "null"
          description: Ob der zweite Faktor eingerichtet und bestätigt ist.
        mussPasswortAendern:
          type: boolean
          description: |
            Ob der Pflichtwechsel des Passworts offen ist. Dann antwortet jede Route unter `/api/v1` ausser
            `GET /api/v1/ich` mit 403.
    AuthSitzung:
      type: object
      description: Sitzung. Das Sitzungstoken ist kein Bearer-Token und gehört nicht in die App-Logik.
      required:
        - id
        - userId
        - expiresAt
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Ablauf der Sitzung (90 Tage ab der letzten Verlängerung).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthAnmeldungErfolg:
      type: object
      description: Angemeldet. Das Session-Cookie steht im `Set-Cookie`-Header.
      required:
        - user
      additionalProperties: true
      properties:
        redirect:
          type: boolean
          description: Immer `false` (die App schickt keine `callbackURL`).
        token:
          type: string
          description: Sitzungstoken; nicht als Bearer-Token verwendbar. Massgeblich ist das Cookie.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthZweiterFaktorAufforderung:
      type: object
      description: |
        Zweiter Faktor verlangt. Es gibt noch keine Sitzung; das Zwischen-Cookie `two_factor` steht im `Set-Cookie`-Header.
      required:
        - twoFactorRedirect
        - twoFactorMethods
      properties:
        twoFactorRedirect:
          type: boolean
          enum:
            - true
        twoFactorMethods:
          type: array
          description: Verfügbare Methoden; heute nur `totp` (Ersatzcodes gehen immer).
          items:
            type: string
            enum:
              - totp
    AuthSitzungAntwort:
      type: object
      required:
        - session
        - user
      properties:
        session:
          $ref: "#/components/schemas/AuthSitzung"
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthAbmeldenAntwort:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    AuthAlleSitzungenBeendenAntwort:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
          enum:
            - true
    AuthPasswortAendernAnfrage:
      type: object
      required:
        - currentPassword
        - newPassword
      description: |
        Weitere Felder von better-auth (`revokeOtherSessions`) setzt der Server selbst auf `true`.
      properties:
        currentPassword:
          type: string
          maxLength: 128
          description: Aktuelles Passwort, bei offenem Pflichtwechsel das Startpasswort (Schreibweise egal).
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: Neues Passwort. Muss sich vom bisherigen unterscheiden und darf nicht aus einem bekannten Datenleck stammen.
    AuthPasswortAendernAntwort:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type:
            - string
            - "null"
          description: Token der neuen Sitzung; nicht als Bearer-Token verwendbar. Massgeblich ist das neue Cookie.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthZweiterFaktorEinrichtenAnfrage:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: Aktuelles Passwort der Person (bei offenem Startpasswort Schreibweise egal).
        method:
          type: string
          enum:
            - totp
            - otp
          default: totp
          description: Nur `totp` ist verfügbar; `otp` ergibt 400 `OTP_NOT_CONFIGURED`.
    AuthZweiterFaktorEinrichtenAntwort:
      type: object
      required:
        - method
        - totpURI
        - backupCodes
      properties:
        method:
          type: string
          enum:
            - totp
        totpURI:
          type: string
          description: |
            `otpauth://totp/FireResponse:<benutzername>?secret=<BASE32>&issuer=FireResponse&digits=6&period=30`.
            Enthält das Geheimnis; als QR-Code oder Link an die Authenticator-App übergeben, nie speichern oder loggen.
          example: otpauth://totp/FireResponse:vorname.nachname?secret=JBSWY3DPEHPK3PXP&issuer=FireResponse&digits=6&period=30
        backupCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Zehn Ersatzcodes; nur jetzt sichtbar. Jeder gilt einmal.
          items:
            type: string
            pattern: ^[a-zA-Z0-9]{5}-[a-zA-Z0-9]{5}$
            example: abc12-xyz34
    AuthCodeAnfrage:
      type: object
      required:
        - code
      description: Das Feld `trustDevice` von better-auth ignoriert der Server.
      properties:
        code:
          type: string
          description: |
            Sechsstelliger TOTP-Code (`verify-totp`, z. B. «012345») oder Ersatzcode im Format `xxxxx-xxxxx`
            (`verify-backup-code`).
          example: "012345"
    AuthZweiterFaktorAnmeldeAntwort:
      type: object
      required:
        - token
        - user
      description: Das neue Session-Cookie steht im `Set-Cookie`-Header.
      properties:
        token:
          type: string
          description: Sitzungstoken; nicht als Bearer-Token verwendbar.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    IchProfil:
      type: object
      description: Das eigene Profil. `pushAnmeldungen` fehlt bei Personen ohne Rolle in einer Einheit.
      required:
        - id
        - name
        - benutzername
        - kantonsadmin
        - zweiterFaktor
        - einwilligung
        - mussPasswortAendern
        - telefon
        - bildUrl
        - pushProgramme
        - einheiten
        - teilnehmende
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        benutzername:
          type: string
          description: 3 bis 64 Zeichen aus Buchstaben, Ziffern, Punkt, Unterstrich und Bindestrich, kleingeschrieben gespeichert.
        kantonsadmin:
          type: boolean
        zweiterFaktor:
          type: boolean
        einwilligung:
          type: boolean
          description: Hat die Person der aktuellen Fassung der Einwilligung zugestimmt? Sonst sperrt die API die App-Routen.
        mussPasswortAendern:
          type: boolean
        telefon:
          type:
            - string
            - "null"
        bildUrl:
          type:
            - string
            - "null"
          description: Pfad zum Profilbild oder `null`.
        pushProgramme:
          type: boolean
        pushAnmeldungen:
          type: boolean
        einheiten:
          type: array
          items:
            $ref: "#/components/schemas/IchEinheit"
        teilnehmende:
          type: array
          items:
            $ref: "#/components/schemas/IchTeilnehmende"
    IchEinstellungen:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Mindestens ein Feld. Fremde Felder ergeben 400.
      properties:
        pushProgramme:
          type: boolean
        pushAnmeldungen:
          type: boolean
        telefon:
          type:
            - string
            - "null"
          maxLength: 30
          description: Eigene Telefonnummer, nur für SL; leerer Text oder `null` entfernt sie.
    TeilnahmenZahlen:
      type: object
      required: [ja, nein, offen]
      properties:
        ja:
          type: integer
        nein:
          type: integer
        offen:
          type: integer
    TeilnahmenUebersicht:
      type: object
      required: [zahlen, teilnehmende, leitende]
      properties:
        zahlen:
          type: object
          required: [teilnehmende, leitende]
          properties:
            teilnehmende:
              $ref: "#/components/schemas/TeilnahmenZahlen"
            leitende:
              $ref: "#/components/schemas/TeilnahmenZahlen"
        teilnehmende:
          type: array
          items:
            type: object
            required: [id, vorname, nachname, status, abzeichen]
            properties:
              id:
                type: string
                format: uuid
              vorname:
                type: string
              nachname:
                type: string
              status:
                type: string
                enum: [ja, nein, offen]
              abzeichen:
                oneOf:
                  - $ref: "#/components/schemas/Abzeichen"
                  - type: "null"
        leitende:
          type: array
          description: Rollen der Einheit mit ihrer Anmeldung; leer für Eltern und Teilnehmende.
          items:
            type: object
            required: [id, name, bildUrl, rolle, status, abzeichen]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              bildUrl:
                type:
                  - string
                  - "null"
              rolle:
                type: string
                enum: [kommandant, stellvertretung, leitung]
              status:
                type: string
                enum: [ja, nein, offen]
              abzeichen:
                oneOf:
                  - $ref: "#/components/schemas/Abzeichen"
                  - type: "null"
    PushTokenAnfrage:
      type: object
      additionalProperties: false
      required:
        - token
        - plattform
      properties:
        token:
          type: string
          pattern: ^[\w:.-]{20,512}$
          description: FCM-Registrierungstoken des Geräts.
          example: cX1y2Z3a4B5c6D7e8F9g:APA91bxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        plattform:
          type: string
          enum:
            - ios
            - android
    ProgrammListeneintrag:
      type: object
      description: |
        Programm, wie es Liste und Detail liefern, mit `teilnehmende` und `eigeneAnmeldung` (derselben Regel in beiden). Alle Schlüssel ausser `eigeneAnmeldung` sind immer vorhanden. Entweder ist `ganztaegig`
        wahr, dann sind `tagVon` und `tagBis` gesetzt und `beginn` und `ende` `null`, oder `ganztaegig` ist falsch,
        dann sind `beginn` und `ende` gesetzt und `tagVon` und `tagBis` `null`.
      required:
        - id
        - titel
        - status
        - ganztaegig
        - beginn
        - ende
        - tagVon
        - tagBis
        - art
        - anmeldbar
        - anmeldungAb
        - teilnahmeOffen
        - einheit
        - teilnehmende
      properties:
        id:
          type: string
          format: uuid
        titel:
          type: string
        status:
          type: string
          enum: [aktiv, abgesagt, pruefen]
        ganztaegig:
          type: boolean
        beginn:
          type:
            - string
            - "null"
          format: date-time
        ende:
          type:
            - string
            - "null"
          format: date-time
        tagVon:
          type:
            - string
            - "null"
          format: date
        tagBis:
          type:
            - string
            - "null"
          format: date
        art:
          type:
            - string
            - "null"
          description: Art des Termins laut Lodur (Sitzung, Übung, Kurs, Anlass …); `null`, wenn die Quelle sie nicht liefert.
        anmeldbar:
          type: boolean
          description: Immer `true`; bleibt nur für Apps, die das Feld lesen, und entfällt mit der nächsten API-Version.
        anmeldungAb:
          type: string
          format: date
          description: Schweizer Kalendertag, ab dem sich anmelden lässt; die App zeigt «Anmeldung ab <Datum>», solange `teilnahmeOffen` falsch ist und der Tag in der Zukunft liegt.
        teilnahmeOffen:
          type: boolean
          description: Aktiv, noch nicht begonnen und Anmeldefenster offen; nur dann lassen sich Antworten ändern.
        einheit:
          $ref: "#/components/schemas/ProgrammEinheit"
        teilnehmende:
          type: array
          items:
            $ref: "#/components/schemas/ProgrammTeilnehmende"
        eigeneAnmeldung:
          type: string
          enum: [ja, nein, offen]
          description: "Die eigene Anmeldung als Leitung. Der Schlüssel fehlt, ausser für Kommando, Stellvertretung und Leitung der Einheit des Termins; er fehlt auch bei `anmeldbar: false`. In Liste und Detail dieselbe Regel."
    ProgrammListe:
      type: object
      required:
        - programme
      properties:
        programme:
          type: array
          items:
            $ref: "#/components/schemas/ProgrammListeneintrag"
    ProgrammDetail:
      description: Das Programm mit dem Stand der Anmeldung.
      allOf:
        - $ref: "#/components/schemas/ProgrammListeneintrag"
        - type: object
          required: [thema, info, aufgebot, kontakt]
          properties:
            thema:
              type:
                - string
                - "null"
            info:
              type:
                - string
                - "null"
            aufgebot:
              type:
                - string
                - "null"
            kontakt:
              description: Die Kontaktperson des Termins.
              oneOf:
                - $ref: "#/components/schemas/Kontakt"
                - type: "null"
    ProgrammAntwort:
      type: object
      description: Antwort «ja» oder «nein» für eine Teilnahme oder eine Leitungsanmeldung.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ja
            - nein
    AdminKonflikt:
      type: object
      description: |
        Fehler mit Statuscode 409. Gleiche Form wie `Fehler`, aber mit eigenen Codes, die der Handler setzt. Texte sind deutsch und für die Anzeige gedacht.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - KEIN_KOMMANDANT
            - GLEICHE_PERSON
            - BENUTZERNAME_VERGEBEN
            - BEZIRK_VORHANDEN
            - BEZIRK_BELEGT
            - EINHEIT_BELEGT
            - EINHEIT_VORHANDEN
            - REIHENFOLGE_BELEGT
            - ROLLE_GLEICH
            - ROLLE_KOMMANDO
            - ELTERN_ANTWORTEN
            - SELBST_ANTWORTET
            - EIGENES_KONTO_VORHANDEN
            - SCHON_VERKNUEPFT
            - EIGENES_KONTO
            - KONTO_GEMEINSAM
            - KEIN_ZWEITER_FAKTOR
            - KEIN_STARTPASSWORT
        message:
          type: string
          example: Diese Person ist schon Kommandantin oder Kommandant.
    AdminKontoAktionen:
      type: object
      description: Was der Akteur an diesem Konto darf. Fehlt eine Aktion, fehlt in der Verwaltung der Knopf.
      required: [bearbeiten, startpasswort, deaktivieren, zweiterFaktor]
      properties:
        bearbeiten:
          type: boolean
          description: Name und Telefon ändern.
        startpasswort:
          type: boolean
        deaktivieren:
          type: boolean
          description: Deaktivieren und Aktivieren.
        zweiterFaktor:
          type: boolean
    AdminPersonenListe:
      type: object
      required: [personen]
      properties:
        personen:
          type: array
          items:
            type: object
            required:
              [
                id,
                name,
                benutzername,
                telefon,
                rolle,
                reihenfolge,
                rang,
                zweiterFaktor,
                startpasswort,
                deaktiviert,
                eigenes,
                gemeinsam,
                hatBild,
                aktionen,
              ]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              benutzername:
                type: [string, "null"]
              telefon:
                type: [string, "null"]
              rolle:
                type: string
                enum: [kommandant, stellvertretung, leitung]
              reihenfolge:
                type: [integer, "null"]
                description: Position der Stellvertretung.
              rang:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
              zweiterFaktor:
                type: boolean
              startpasswort:
                description: Offenes Startpasswort; `null`, wenn keines offen ist. Nie das Passwort selbst.
                oneOf:
                  - type: "null"
                  - type: object
                    required: [gueltigBis, abgelaufen]
                    properties:
                      gueltigBis:
                        type: [string, "null"]
                        format: date-time
                      abgelaufen:
                        type: boolean
              deaktiviert:
                type: boolean
              eigenes:
                type: boolean
                description: Das Konto des Akteurs.
              gemeinsam:
                type: boolean
                description: Das Konto gehört auch zu einer anderen Einheit; dann ändert nur der Kantonsadmin es.
              hatBild:
                type: boolean
                description: Die Person hat ein Profilbild. Ohne Bild ruft das Panel `GET /api/v1/admin/personen/{id}/bild` nicht auf und zeigt die Initialen.
              aktionen:
                $ref: "#/components/schemas/AdminKontoAktionen"
    AdminPersonAendern:
      type: object
      description: Mindestens ein Feld.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 201
          description: «Vorname Nachname» in einem Feld.
        telefon:
          type: [string, "null"]
          description: Nur Kommando und Stellvertretungen; leer oder `null` entfernt die Nummer.
        rangId:
          type: [string, "null"]
          format: uuid
          description: Rang der Einheit; `null` entfernt ihn.
    AdminStartpasswort:
      type: object
      required: [startpasswort, gueltigBis]
      properties:
        startpasswort:
          type: string
          description: Gilt 7 Tage, nur für die erste Anmeldung.
        gueltigBis:
          type: [string, "null"]
          format: date-time
    AdminTeilnehmendeListe:
      type: object
      required: [teilnehmende]
      properties:
        teilnehmende:
          type: array
          items:
            type: object
            required: [id, vorname, nachname, aktiv, rang, konten]
            properties:
              id:
                type: string
                format: uuid
              vorname:
                type: string
              nachname:
                type: string
              aktiv:
                type: boolean
              rang:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
              konten:
                type: array
                description: "Leer heisst: Es antwortet niemand."
                items:
                  type: object
                  required:
                    [
                      id,
                      name,
                      benutzername,
                      art,
                      zweiterFaktor,
                      startpasswort,
                      deaktiviert,
                      eigenes,
                      gemeinsam,
                      aktionen,
                    ]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    benutzername:
                      type: [string, "null"]
                    art:
                      type: string
                      enum: [eltern, selbst]
                    zweiterFaktor:
                      type: boolean
                    startpasswort:
                      description: Offenes Startpasswort; `null`, wenn keines offen ist. Nie das Passwort selbst.
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [gueltigBis, abgelaufen]
                          properties:
                            gueltigBis:
                              type: [string, "null"]
                              format: date-time
                            abgelaufen:
                              type: boolean
                    deaktiviert:
                      type: boolean
                    eigenes:
                      type: boolean
                      description: Das Konto des Akteurs.
                    gemeinsam:
                      type: boolean
                      description: Das Konto gehört auch zu einer anderen Einheit; dann ändert nur der Kantonsadmin es.
                    aktionen:
                      $ref: "#/components/schemas/AdminKontoAktionen"
    AdminTeilnehmendeAendern:
      type: object
      description: Mindestens ein Feld.
      additionalProperties: false
      properties:
        vorname:
          type: string
          minLength: 1
          maxLength: 100
        nachname:
          type: string
          minLength: 1
          maxLength: 100
        rangId:
          type: [string, "null"]
          format: uuid
        aktiv:
          type: boolean
    AdminRaengeListe:
      type: object
      required: [raenge]
      properties:
        raenge:
          type: array
          items:
            type: object
            required:
              [
                id,
                name,
                kuerzel,
                typ,
                reihenfolge,
                abzeichen,
                teilnehmende,
                rollen,
              ]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              kuerzel:
                type: string
              typ:
                $ref: "#/components/schemas/RangTyp"
              reihenfolge:
                type: integer
                minimum: 1
                maximum: 999
              abzeichen:
                description: Sterne, eigenes Bild oder keines.
                oneOf:
                  - type: "null"
                  - type: object
                    required: [art, sterne]
                    properties:
                      art:
                        type: string
                        enum: [sterne]
                      sterne:
                        type: integer
                        minimum: 0
                        maximum: 2
                  - type: object
                    required: [art, typ, url]
                    properties:
                      art:
                        type: string
                        enum: [bild]
                      typ:
                        type: string
                        enum: [svg, png]
                      url:
                        type: string
                        description: Pfad zum Bild (`GET .../abzeichen`), mit `?v=` als Stand des Bildes.
              teilnehmende:
                type: integer
                description: Teilnehmende mit diesem Rang.
              rollen:
                type: integer
                description: Kommando, Stellvertretungen und Leitende mit diesem Rang.
    RangTyp:
      type: string
      enum: [kf, jf, miliz]
      description: Kinderfeuerwehr, Jugendfeuerwehr oder Miliz-Feuerwehr (Schweizer Dienstgrade). Der Typ ordnet den Rang ein; die Miliz-Dienstgrade legt das Backend als Standard-Ränge an. Die Apps erfahren ihn nicht.
    AdminAenderungen:
      type: object
      required: [eintraege, weiter]
      properties:
        eintraege:
          type: array
          items:
            type: object
            required:
              [id, zeit, aktion, akteur, zielTyp, zielId, einheit, details]
            properties:
              id:
                type: string
                format: uuid
              zeit:
                type: string
                format: date-time
              aktion:
                type: string
                example: startpasswort_neu
              akteur:
                type: object
                required: [id, name, cli]
                properties:
                  id:
                    type: [string, "null"]
                  name:
                    type: [string, "null"]
                  cli:
                    type: boolean
              zielTyp:
                type: string
              zielId:
                type: string
                format: uuid
              einheit:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name, typ, bezirk]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      typ:
                        type: string
                        enum: [jf, kf]
                      bezirk:
                        type: string
              details:
                description: Feste Schlüssel und Werte, ohne Personendaten.
                type: [object, "null"]
                additionalProperties: true
        weiter:
          type: [string, "null"]
          format: uuid
          description: Als `vor` für die nächste Seite; `null` am Ende.
    AdminSync:
      type: object
      required: [einheiten]
      properties:
        einheiten:
          type: array
          items:
            type: object
            required:
              [id, name, typ, bezirk, lodurHinterlegt, syncOkAm, syncFehler]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              typ:
                type: string
                enum: [jf, kf]
              bezirk:
                type: string
              lodurHinterlegt:
                type: boolean
              syncOkAm:
                type: [string, "null"]
                format: date-time
              syncFehler:
                type: [string, "null"]
                description: Fehlercode, nie eine Meldung.
    AdminZeitregelAnlegen:
      type: object
      required:
        - tageVorher
        - uhrzeit
        - text
        - aktiv
      additionalProperties: false
      properties:
        tageVorher:
          type: integer
          minimum: 0
          maximum: 7
          description: Kalendertage vor dem Tag des Programmbeginns (Schweizer Zeit); 0 heisst am Tag selbst.
        uhrzeit:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:mm in Schweizer Zeit (Europe/Zurich, Sommerzeit inbegriffen).
          example: "08:00"
        text:
          type: string
          minLength: 1
          maxLength: 150
          description: |
            Der Push-Titel. Leerraum am Rand wird entfernt. Der Server ersetzt `{Programm}` durch den Titel und `{Datum}` durch den Tag des Programms (z. B. «Sa 31.10.»). Keine Namen: Der Text läuft über Apple und Google.
          example: "{Programm} am {Datum}: bitte anmelden oder abmelden"
        beschreibung:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 300
          description: Optionaler Text unter dem Titel, mit denselben Platzhaltern. Ohne Angabe oder `null` hat der Push keinen Text. Keine Namen.
        aktiv:
          type: boolean
    AdminZeitregelAendern:
      type: object
      description: Alle Felder optional; ein leeres Objekt ist erlaubt (No-op).
      additionalProperties: false
      properties:
        tageVorher:
          type: integer
          minimum: 0
          maximum: 7
        uhrzeit:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        text:
          type: string
          minLength: 1
          maxLength: 150
        beschreibung:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 300
          description: "`null` entfernt die Beschreibung."
        aktiv:
          type: boolean
    AdminZeitregel:
      type: object
      required:
        - id
        - tageVorher
        - uhrzeit
        - text
        - beschreibung
        - aktiv
      properties:
        id:
          type: string
          format: uuid
        tageVorher:
          type: integer
          minimum: 0
          maximum: 7
        uhrzeit:
          type: string
          example: "08:00"
        text:
          type: string
        beschreibung:
          type:
            - string
            - "null"
        aktiv:
          type: boolean
    AdminZeitregelListe:
      type: object
      required:
        - regeln
      properties:
        regeln:
          type: array
          items:
            $ref: "#/components/schemas/AdminZeitregel"
    AdminTermine:
      type: object
      additionalProperties: false
      required: [termine]
      properties:
        termine:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, titel, art, status, ganztaegig, beginn, ende, tagVon, tagBis, nurLeitende]
            properties:
              id:
                type: string
                format: uuid
              titel:
                type: string
              art:
                type: [string, "null"]
                description: Art laut Lodur (Sitzung, Übung, Kurs …).
              status:
                type: string
                enum: [aktiv, abgesagt, pruefen]
              ganztaegig:
                type: boolean
              beginn:
                type: [string, "null"]
                format: date-time
                description: "`null` bei ganztägigen Terminen; dann gelten `tagVon` und `tagBis`."
              ende:
                type: [string, "null"]
                format: date-time
              tagVon:
                type: [string, "null"]
                format: date
              tagBis:
                type: [string, "null"]
                format: date
              nurLeitende:
                type: boolean
    AdminLodurSetzen:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 4096
          description: Der ganze Lodur-Link; `https`, ohne Port und Zugangsdaten, Host aus `LODUR_ERLAUBTE_HOSTS`.
    AdminLodurStand:
      type: object
      additionalProperties: false
      required: [gesetzt, maskiert, syncOkAm, syncFehler]
      properties:
        gesetzt:
          type: boolean
        maskiert:
          type: [string, "null"]
          description: Nur `https://<host>/…`, nie Pfad oder Schlüssel. `null` ohne Link oder wenn das Geheimnis gewechselt wurde.
        syncOkAm:
          type: [string, "null"]
          format: date-time
          description: Letzter gelungener Abruf; `null` vor dem ersten.
        syncFehler:
          type: [string, "null"]
          description: Code des letzten gescheiterten Abrufs, sonst `null`.
          enum:
            - url-ungueltig
            - entschluesselung
            - weiterleitung
            - http-fehler
            - zeitueberschreitung
            - netzwerk
            - zu-gross
            - kein-kalender
            - leer
            - intern
            - null
    AdminLodurLinkUngueltig:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [LODUR_LINK_UNGUELTIG]
        message:
          type: string
    AdminAngelegt:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    AdminSystem:
      type: object
      additionalProperties: false
      required: [prozess, datenbank, bestand, umgebung]
      properties:
        prozess:
          type: object
          additionalProperties: false
          required:
            [
              node,
              gestartetAm,
              laufzeitSekunden,
              rssMb,
              heapGenutztMb,
              heapGesamtMb,
              schleifeP99Ms,
              commit,
            ]
          properties:
            node:
              type: string
              example: v24.15.0
            gestartetAm:
              type: string
              format: date-time
            laufzeitSekunden:
              type: integer
            rssMb:
              type: number
            heapGenutztMb:
              type: number
            heapGesamtMb:
              type: number
            schleifeP99Ms:
              type: [number, "null"]
              description: 99. Perzentil der Verzögerung der Ereignisschleife seit dem letzten Abruf; `null` ohne Messwerte.
            commit:
              type: [string, "null"]
              description: Commit-Hash des Builds, nur wenn die Umgebung ihn setzt (`COMMIT_SHA`, 7 bis 40 Hex-Zeichen).
        datenbank:
          type: object
          additionalProperties: false
          required: [erreichbar, pingMs, verbindungen, poolMaximum]
          properties:
            erreichbar:
              type: boolean
            pingMs:
              type: [integer, "null"]
            verbindungen:
              type: [integer, "null"]
              description: Offene Verbindungen zur Datenbank, aller Anwendungen (API, Jobs).
            poolMaximum:
              type: integer
              description: Grösse des Pools der API.
        bestand:
          type: object
          additionalProperties: false
          required: [aktivePersonen, aktiveTeilnehmende, pushTokens]
          properties:
            aktivePersonen:
              type: integer
            aktiveTeilnehmende:
              type: integer
            pushTokens:
              type: integer
        umgebung:
          type: object
          additionalProperties: false
          required: [https, produktion]
          properties:
            https:
              type: boolean
              description: "`BETTER_AUTH_URL` beginnt mit https."
            produktion:
              type: boolean
    AdminSystemPunkt:
      type: object
      additionalProperties: false
      required: [ab, anzahl, fehler4xx, fehler5xx]
      properties:
        ab:
          type: string
          format: date-time
          description: Beginn des Zeitraums.
        anzahl:
          type: integer
        fehler4xx:
          type: integer
        fehler5xx:
          type: integer
    AdminSystemRequests:
      type: object
      additionalProperties: false
      required:
        [
          seit,
          gesamt,
          letzteMinute,
          letzteStunde,
          statusklassen,
          quote5xx,
          quote4xx,
          p50Ms,
          p95Ms,
          stunden,
          minuten,
          routen,
          letzteFehler,
        ]
      properties:
        seit:
          type: string
          format: date-time
          description: Start der API; davor gibt es keine Zahlen.
        gesamt:
          type: integer
          description: Anfragen der letzten 24 Stunden bzw. seit dem Start.
        letzteMinute:
          type: integer
        letzteStunde:
          type: integer
        statusklassen:
          type: object
          additionalProperties: false
          required: ["1xx", "2xx", "3xx", "4xx", "5xx"]
          properties:
            "1xx":
              type: integer
            "2xx":
              type: integer
            "3xx":
              type: integer
            "4xx":
              type: integer
            "5xx":
              type: integer
        quote5xx:
          type: number
          description: Anteil der Antworten mit 5xx an allen (0 bis 1).
        quote4xx:
          type: number
        p50Ms:
          type: [integer, "null"]
        p95Ms:
          type: [integer, "null"]
        stunden:
          type: array
          description: 24 Stunden bis jetzt, ältester Zeitraum zuerst.
          items:
            $ref: "#/components/schemas/AdminSystemPunkt"
        minuten:
          type: array
          description: 60 Minuten bis jetzt, älteste zuerst.
          items:
            $ref: "#/components/schemas/AdminSystemPunkt"
        routen:
          type: array
          description: Seit dem Start, häufigste zuerst. Höchstens 200 Muster; weitere zählen unter `andere` (ohne Methode).
          items:
            type: object
            additionalProperties: false
            required:
              [methode, route, anzahl, fehler4xx, fehler5xx, p50Ms, p95Ms]
            properties:
              methode:
                type: string
              route:
                type: string
                description: Muster wie `/api/v1/admin/personen/:id`, nie der konkrete Pfad.
              anzahl:
                type: integer
              fehler4xx:
                type: integer
              fehler5xx:
                type: integer
              p50Ms:
                type: [integer, "null"]
              p95Ms:
                type: [integer, "null"]
        letzteFehler:
          type: array
          description: Die letzten höchstens 30 Antworten mit Status 400 oder höher, neueste zuerst. Nur Zeit, Methode, Routenmuster und Status.
          items:
            type: object
            additionalProperties: false
            required: [zeit, methode, route, status]
            properties:
              zeit:
                type: string
                format: date-time
              methode:
                type: string
              route:
                type: string
              status:
                type: integer
    IchEinheit:
      type: object
      description: Eine Einheit (Jugend- oder Kinderfeuerwehr eines Bezirks), in der die Person Kommandant, Stellvertretung oder Leitung ist.
      required: [id, name, typ, bezirk, rolle, logoUrl, abzeichen]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: JF Beispielstadt
        typ:
          type: string
          enum: [jf, kf]
        bezirk:
          type: string
          example: Bezirk Beispiel
        rolle:
          type: string
          enum: [kommandant, stellvertretung, leitung]
        logoUrl:
          type: [string, "null"]
          description: Pfad zum Logo (`GET /api/v1/einheiten/{einheitId}/logo`), mit `?v=` als Stand des Bildes; `null` ohne Logo.
        abzeichen:
          description: Das eigene Abzeichen in dieser Einheit; `null` ohne Rang.
          oneOf:
            - $ref: "#/components/schemas/Abzeichen"
            - type: "null"
    IchTeilnehmende:
      type: object
      description: Eine aktive teilnehmende Person, für die das Konto antwortet.
      required:
        [
          id,
          vorname,
          nachname,
          einheitId,
          einheitName,
          einheitTyp,
          art,
          abzeichen,
        ]
      properties:
        id:
          type: string
          format: uuid
        vorname:
          type: string
        nachname:
          type: string
        einheitId:
          type: string
          format: uuid
          description: Das Logo liegt unter `/einheiten/{einheitId}/logo`; die Person darf es abrufen (200, ohne Logo 404).
        einheitName:
          type: string
          example: JF Beispielstadt
        einheitTyp:
          type: string
          enum: [jf, kf]
        art:
          type: string
          enum: [eltern, selbst]
          description: "`eltern`, wenn das Konto für die Person antwortet, `selbst`, wenn es das Konto der Person ist."
        abzeichen:
          oneOf:
            - $ref: "#/components/schemas/Abzeichen"
            - type: "null"
    Datenschutz:
      type: object
      required: [version, abschnitte]
      properties:
        version:
          type: integer
          description: Fassung der Erklärung; dieselbe Zahl wie `version` in `Einwilligung`. Steigt sie, fragt die App neu.
        abschnitte:
          type: array
          description: Die Abschnitte in der Reihenfolge der Seite.
          items:
            type: object
            required: [titel, text]
            properties:
              titel:
                type: string
              text:
                type: string
                description: Klartext ohne HTML. Absätze und Listenpunkte (beginnen mit «– ») sind durch eine Leerzeile getrennt.
    Einwilligung:
      type: object
      required: [version, text, gueltig]
      properties:
        version:
          type: integer
          description: Aktuelle Fassung; eine neue Fassung heisst neu fragen.
        text:
          type: string
        gueltig:
          type: boolean
          description: Hat die angemeldete Person dieser Fassung zugestimmt?
    ProgrammEinheit:
      type: object
      required: [id, name, typ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        typ:
          type: string
          enum: [jf, kf]
    ProgrammTeilnehmende:
      type: object
      description: Eine eigene aktive teilnehmende Person der Einheit des Programms mit ihrer Antwort.
      required: [id, vorname, status, abzeichen]
      properties:
        id:
          type: string
          format: uuid
        vorname:
          type: string
        status:
          type:
            - string
            - "null"
          enum: [ja, nein, null]
          description: "`null` heisst offen."
        abzeichen:
          oneOf:
            - $ref: "#/components/schemas/Abzeichen"
            - type: "null"
    Abzeichen:
      type: object
      description: |
        Das Rang-Abzeichen; mehr vom Rang erfährt die App nicht. Das Objekt kommt für jede Person mit Rang. `kuerzel` ist immer da; dazu
        entweder `sterne` (0 bis 2) oder `bildUrl`, das andere Feld ist `null`. Hat der Rang weder Sterne noch Bild, sind beide `null`
        und die App zeigt nur das Kürzel. `null` statt des Objekts heisst nur noch: kein Rang.
      required: [kuerzel, sterne, bildUrl]
      properties:
        kuerzel:
          type: string
          minLength: 1
          maxLength: 20
          description: Kurzer Text des Rangs, den die App neben dem Namen anzeigen kann, zum Beispiel `Oblt` bei einem Miliz-Rang oder `R1` bei einem eigenen Rang. Höchstens 20 Zeichen.
          example: Oblt
        sterne:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 2
        bildUrl:
          type:
            - string
            - "null"
          description: Pfad zu `GET /api/v1/raenge/{id}/abzeichen`.
    Kontakt:
      type: object
      required: [id, name, rolle, bildUrl, abzeichen, telefon]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rolle:
          type: string
          enum: [kommandant, stellvertretung]
        bildUrl:
          type:
            - string
            - "null"
          description: Pfad zu `GET /api/v1/personen/{id}/bild` oder `null` ohne Bild.
        abzeichen:
          oneOf:
            - $ref: "#/components/schemas/Abzeichen"
            - type: "null"
        telefon:
          type:
            - string
            - "null"
          description: Nur für Eltern und Teilnehmende mit aktiver Person in der Einheit gefüllt, sonst `null`.
    KommandoUebergabe:
      type: object
      required: [neuerKommandantId, bisherigeRolle]
      additionalProperties: false
      properties:
        neuerKommandantId:
          type: string
          format: uuid
          description: Aktives Konto, das nicht selbst Kantonsadmin ist.
        bisherigeRolle:
          description: Neue Rolle der bisherigen Kommandantin oder des bisherigen Kommandanten.
          oneOf:
            - type: object
              required: [typ, reihenfolge]
              additionalProperties: false
              properties:
                typ:
                  const: stellvertretung
                reihenfolge:
                  type: integer
                  minimum: 1
                  maximum: 99
            - type: object
              required: [typ]
              additionalProperties: false
              properties:
                typ:
                  const: leitung
            - type: object
              required: [typ]
              additionalProperties: false
              properties:
                typ:
                  const: keine
    AdminRangAnzeige:
      type: object
      description: Rang einer Person mit Abzeichen, für Listen der Verwaltung.
      required: [id, name, kuerzel, abzeichen]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kuerzel:
          type: string
        abzeichen:
          description: Sterne, eigenes Bild oder keines.
          oneOf:
            - type: "null"
            - type: object
              required: [art, sterne]
              properties:
                art:
                  type: string
                  enum: [sterne]
                sterne:
                  type: integer
                  minimum: 0
                  maximum: 2
            - type: object
              required: [art, typ, url]
              properties:
                art:
                  type: string
                  enum: [bild]
                typ:
                  type: string
                  enum: [svg, png]
                url:
                  type: string
                  description: Pfad zum Bild (`GET .../abzeichen`), mit `?v=` als Stand des Bildes.
    AuswertungZahlen:
      type: object
      description: Anmeldungen als Zahlen; `quote` ist `ja` geteilt durch die Summe, drei Stellen, `null` ohne Bezug.
      required: [ja, nein, offen, quote]
      properties:
        ja:
          type: integer
        nein:
          type: integer
        offen:
          type: integer
        quote:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    AuswertungEinheitKurz:
      type: object
      required: [id, name, typ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        typ:
          type: string
          enum: [jf, kf]
    AuswertungFilter:
      type: object
      required: [umschalter, bezirke, einheiten]
