        umschalter:
          type: boolean
          description: Nur das Kantonsadmin-Konto schaltet zwischen allen Bezirken und Einheiten um.
        bezirke:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        einheiten:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AuswertungEinheitKurz"
              - type: object
                required: [bezirkId]
                properties:
                  bezirkId:
                    type: string
                    format: uuid
    AuswertungTerminKopf:
      type: object
      required:
        [
          id,
          titel,
          status,
          ganztaegig,
          beginn,
          ende,
          tagVon,
          tagBis,
          begonnen,
          einheit,
        ]
