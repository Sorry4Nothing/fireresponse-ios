              kommandant:
                description: Kommandantin oder Kommandant; `null`, solange keine Person eingesetzt ist.
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name, rang]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      rang:
                        description: Rang der Person in der Einheit; `null` ohne Rang.
                        oneOf:
                          - type: "null"
                          - $ref: "#/components/schemas/AdminRangAnzeige"
              teilnehmende:
                type: integer
                description: Zahl der aktiven teilnehmenden Personen.
              rolle:
