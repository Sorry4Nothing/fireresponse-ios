  /api/auth/sign-in/username:
    post:
      operationId: anmeldenMitBenutzername
      summary: Mit Benutzername und Passwort anmelden
      tags:
        - Authentifizierung
      security: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Öffentlich. Einziger Weg zur Anmeldung (E-Mail-Anmeldung und Registrierung gibt es nicht).

        **Sitzung.** Bei Erfolg setzt die Antwort ein Session-Cookie (siehe Sicherheitsschema `sitzung`).
        Das Cookie ist 90 Tage gültig (`Max-Age=7776000`). Alle weiteren Aufrufe tragen es als `Cookie`-Header.

        **Zweiter Faktor.** Hat die Person den zweiten Faktor eingerichtet (Kantonsadmin, Kommando), setzt die
        Antwort noch *keine* Sitzung. Sie gibt `twoFactorRedirect: true` zurück und setzt ein Zwischen-Cookie
        (`two_factor`). Die App schickt es mit dem Code an `POST /api/auth/two-factor/verify-totp` oder
        `POST /api/auth/two-factor/verify-backup-code`; erst dann entsteht die Sitzung.

        **Startpasswort.** Hat die Person noch ein Startpasswort (`mussPasswortAendern` in
        `GET /api/auth/get-session` und `GET /api/v1/ich`), zählen bei der Eingabe Gross-/Kleinschreibung,
        Bindestriche und Leerzeichen nicht. Ist das Startpasswort abgelaufen (7 Tage), ist keine Anmeldung möglich.
        Solange der Pflichtwechsel offen ist, antwortet jede Route unter `/api/v1` ausser `GET /api/v1/ich`
        mit 403; die App führt zu `POST /api/auth/change-password`.

        **Fehler.** Jeder Fehlschlag mit Status 4xx (ausser 429) antwortet mit demselben 401 und demselben Text
        `ANMELDUNG_FEHLGESCHLAGEN`: falsches Passwort, unbekannter Name, Wartezeit, abgelaufenes Startpasswort,
        deaktiviertes Konto, ungültiger Name, ungültige Herkunft, fehlerhafter Body. Es wird kein Cookie gesetzt.
        Die App kann die Fälle nicht unterscheiden.

        **Bremse.** Ab dem 5. Fehlversuch in Folge gilt pro Benutzername eine Wartezeit: 1 Minute, dann 5, dann
        15 Minuten. Liegt der letzte Fehlversuch 15 Minuten zurück, also spätestens nach der längsten Wartezeit,
        beginnt die Zählung bei 0. Während der Wartezeit antwortet die Route auch bei richtigem Passwort mit 401.
        Zusätzlich gilt ein Limit von 30 Anfragen je 15 Minuten und Client-IP (429 `ZU_VIELE_ANFRAGEN`, Header
        `X-Retry-After` in Sekunden).

        **Rollen.** Alle Personen mit Konto; deaktivierte Konten und unbekannte Namen bekommen 401.
        Statuscodes: 200, 401, 426, 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAnmeldungAnfrage"
      responses:
        "200":
          description: |
            Angemeldet (mit `Set-Cookie`) oder zweiter Faktor verlangt (ohne Sitzungs-Cookie).
          headers:
            Set-Cookie:
              description: Session-Cookie bei `AuthAnmeldungErfolg`, Zwischen-Cookie `two_factor` bei `AuthZweiterFaktorAufforderung`.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthAnmeldungErfolg"
                  - $ref: "#/components/schemas/AuthZweiterFaktorAufforderung"
        "401":
          description: Anmeldung fehlgeschlagen (jeder Grund, immer derselbe Text), ohne Cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              example:
                code: ANMELDUNG_FEHLGESCHLAGEN
                message: Anmeldung nicht möglich. Bitte Benutzername und Passwort prüfen oder später nochmals versuchen. Sonst hilft ein Admin.
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/sign-out:
    post:
      operationId: abmelden
      summary: Abmelden (aktuelle Sitzung beenden)
      tags:
        - Authentifizierung
      security:
        - {}
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Beendet die Sitzung des mitgeschickten Cookies und löscht es (`Set-Cookie` mit `Max-Age=0`).
        Antwortet auch ohne oder mit abgelaufener Sitzung mit 200. Der Body darf leer sein oder `{}`.

        Wer offline ist, kann die Sitzung lokal verwerfen; die Server-Sitzung endet dann mit ihrem Ablauf.

        **Rollen.** Alle, auch ohne Sitzung. Statuscodes: 200, 426, 429.
        Ohne vertraute Herkunft (siehe Parameter `Origin`) antwortet die Route bei mitgeschicktem Cookie mit 403
        (`INVALID_ORIGIN` oder `MISSING_OR_NULL_ORIGIN`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Sitzung beendet (oder keine vorhanden).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAbmeldenAntwort"
        "403":
          description: Herkunft nicht vertraut oder fehlt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/get-session:
    get:
      operationId: sitzungAbfragen
      summary: Aktuelle Sitzung und Person lesen
      tags:
        - Authentifizierung
      security:
        - {}
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Gibt die Sitzung und die angemeldete Person zurück, oder `null` ohne gültige Sitzung (dann 200, nicht 401).
        Die Antwort trägt `Cache-Control: no-store`.

        Hier erfährt die App, ob der Pflichtwechsel des Passworts offen ist (`user.mussPasswortAendern`)
        und ob der zweite Faktor eingerichtet ist (`user.twoFactorEnabled`). Das vollständige Profil mit Einheiten und
        Teilnehmenden liefert `GET /api/v1/ich`.

        **Verlängerung.** Diese Route verlängert die Sitzung um 90 Tage, sobald seit der letzten Verlängerung
        mehr als 1 Tag vergangen ist, und schickt dann ein neues `Set-Cookie`. Das Cookie ersetzt das alte.
        Die Routen unter `/api/v1` verlängern nicht.

        **Rollen.** Alle, auch ohne Sitzung. Statuscodes: 200, 426, 429.
      responses:
        "200":
          description: Sitzung mit Person, oder `null`.
          headers:
            Set-Cookie:
              description: Nur bei einer fälligen Verlängerung oder einer ungültigen Sitzung (dann wird das Cookie gelöscht).
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/AuthSitzungAntwort"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/change-password:
    post:
      operationId: passwortAendern
      summary: Eigenes Passwort ändern
      tags:
        - Authentifizierung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Ändert das Passwort der angemeldeten Person. Dient auch dem Pflichtwechsel nach einem Startpasswort.

        Der Server beendet dabei immer alle anderen Sitzungen der Person (die Anfrage wird so behandelt, als stünde
        `revokeOtherSessions: true` darin) und stellt für das aufrufende Gerät eine neue Sitzung aus: Die Antwort
        trägt ein neues `Set-Cookie`, das das alte ersetzt. Nach Erfolg ist der Pflichtwechsel erledigt
        (`mussPasswortAendern` wird `false`).

        Bei offenem Pflichtwechsel zählen in `currentPassword` (und beim Vergleich mit `newPassword`) Gross-/Kleinschreibung,
        Bindestriche und Leerzeichen des Startpassworts nicht.

        **Grenzen.** `newPassword`: mindestens 12, höchstens 128 Zeichen, keine Zeichenregeln. Das neue Passwort darf
        nicht aus einem bekannten Datenleck stammen (HaveIBeenPwned) und muss sich vom bisherigen unterscheiden.
        Limit: 5 Anfragen je 15 Minuten und Client-IP (429).

        **Rollen.** Alle angemeldeten Personen, auch bei offenem Pflichtwechsel. Statuscodes: 200, 400, 401, 426, 429.
        Bekannte Fehlercodes bei 400: `PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`, `INVALID_PASSWORD` (aktuelles Passwort
        falsch), `PASSWORT_UNVERAENDERT`, `PASSWORD_COMPROMISED`. Der Fehlerkörper ist `{code, message}`; `message`
        von better-auth-Codes (englische Grossbuchstaben) ist englisch und nicht zur Anzeige gedacht.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswortAendernAnfrage"
      responses:
        "200":
          description: Passwort geändert; neues Session-Cookie im `Set-Cookie`.
          headers:
            Set-Cookie:
              description: Neues Session-Cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswortAendernAntwort"
        "400":
          description: |
            Eingabe abgelehnt. Codes: `PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`, `INVALID_PASSWORD`,
            `PASSWORT_UNVERAENDERT`, `PASSWORD_COMPROMISED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              example:
                code: PASSWORT_UNVERAENDERT
                message: Das neue Passwort muss sich vom bisherigen unterscheiden.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/revoke-sessions:
    post:
      operationId: alleSitzungenBeenden
      summary: Überall abmelden (alle Sitzungen beenden)
      tags:
        - Authentifizierung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Beendet alle Sitzungen der angemeldeten Person, auch die aufrufende. Danach antwortet jede Route mit 401;
        die App verwirft ihr Cookie. Sitzungen anderer Personen bleiben unberührt. Der Body darf leer sein oder `{}`.

        **Rollen.** Alle angemeldeten Personen. Statuscodes: 200, 401 (ohne Sitzung oder deaktiviert), 426, 429.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Alle Sitzungen beendet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAlleSitzungenBeendenAntwort"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/two-factor/enable:
    post:
      operationId: zweitenFaktorEinrichten
      summary: Zweiten Faktor (TOTP) einrichten
      tags:
        - Authentifizierung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Erster von zwei Schritten: Erzeugt das Geheimnis und die Ersatzcodes. Der zweite Faktor ist erst nach
        `POST /api/auth/two-factor/verify-totp` mit dem ersten Code aktiv (`twoFactorEnabled` wird erst dann `true`).
        Ein Aufruf allein schaltet nichts ein und entsperrt die Admin-Routen nicht.

        Nur Konten der Verwaltung richten den zweiten Faktor ein: Kantonsadmin, Kommando und Stellvertretungen. Für alle anderen
        Personen (auch ohne Sitzung) antwortet der Pfad mit 404 `NICHT_GEFUNDEN`, als gäbe es ihn nicht. Die Verwaltung braucht den Faktor
        für alle Routen unter `/api/v1/admin`; ohne ihn antworten diese mit 403 `ZWEITER_FAKTOR_FEHLT`. Der Faktor gehört zum Konto:
        Wer ihn eingerichtet hat, gibt bei jeder Anmeldung den Code ein, auch in der App. Konten ohne Verwaltungsrolle (Leitende, Eltern,
        Teilnehmende) melden sich nie mit zweitem Faktor an; hat eine Sitzung keinen, bekommt sie unter `/api/v1/admin` 403.

        Der Link `totpURI` (`otpauth://`) trägt «FireResponse» als Aussteller und den Benutzernamen als Kontonamen,
        6 Stellen und 30 Sekunden. Er enthält das Geheimnis und wird nur einmal gezeigt. Die zehn Ersatzcodes
        haben das Format `xxxxx-xxxxx` (je 5 Zeichen `a-z`, `A-Z`, `0-9`) und gelten je einmal.

        Bei bereits aktivem Faktor antwortet die Route mit 400 `TOTP_ALREADY_ENABLED`, mit `method: otp` mit
        400 `OTP_NOT_CONFIGURED`. Ein falsches Passwort ergibt 400 `INVALID_PASSWORD`. Bei offenem Startpasswort zählen
        Gross-/Kleinschreibung, Bindestriche und Leerzeichen nicht.

        Wird der Faktor mit dem ersten Code bestätigt, beendet der Server alle anderen Sitzungen der Person
        und stellt ein neues Session-Cookie aus.

        **Rollen.** Kantonsadmin, Kommando und Stellvertretungen (auch ohne bisherigen zweiten Faktor). Statuscodes: 200, 400,
        404 (keine Verwaltungsrolle oder keine Sitzung), 426, 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthZweiterFaktorEinrichtenAnfrage"
      responses:
        "200":
          description: Geheimnis und Ersatzcodes erzeugt, noch nicht bestätigt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZweiterFaktorEinrichtenAntwort"
        "400":
          description: |
            Codes: `INVALID_PASSWORD`, `TOTP_ALREADY_ENABLED`, `OTP_NOT_CONFIGURED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/two-factor/verify-totp:
    post:
      operationId: totpBestaetigen
      summary: TOTP-Code prüfen (Anmeldung oder Einrichtung)
      tags:
        - Authentifizierung
      security:
        - zweiterFaktorZwischenschritt: []
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Zwei Verwendungen:

        1. **Anmeldung.** Nach `POST /api/auth/sign-in/username` mit `twoFactorRedirect: true` schickt die App das
           Zwischen-Cookie `two_factor` und den Code. Bei einem richtigen Code entsteht die Sitzung (`Set-Cookie`),
           das Zwischen-Cookie wird gelöscht. Pro Zwischen-Cookie sind 5 Versuche erlaubt, danach 400
           `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE` und die App meldet sich neu an. Wiederholte Fehlversuche sperren
           das Konto vorübergehend (429).
        2. **Einrichtung.** In einer laufenden Sitzung nach `POST /api/auth/two-factor/enable` bestätigt der erste
           richtige Code den Faktor. Der Server beendet alle anderen Sitzungen der Person und stellt ein neues
           Session-Cookie aus, das das alte ersetzt. In dieser Verwendung zählt der Server keine Fehlversuche.

        «Gerät vertrauen» (`trustDevice`) gibt es nicht: Der Server ignoriert das Feld, jede Anmeldung auf einem
        neuen Gerät fragt nach dem Code.

        Limit: 5 Anfragen je 15 Minuten und Client-IP (429).

        **Rollen.** Alle mit Zwischen-Cookie oder Sitzung; im Betrieb Admins. Statuscodes: 200, 400, 401, 426, 429.
        Bekannte Fehlercodes: 401 `INVALID_CODE` (falscher Code), 401 `INVALID_TWO_FACTOR_COOKIE` (weder Sitzung noch
        gültiges Zwischen-Cookie), 400 `TOTP_NOT_ENABLED` (kein Faktor eingerichtet),
        400 `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeAnfrage"
      responses:
        "200":
          description: Code richtig.
          headers:
            Set-Cookie:
              description: Neues Session-Cookie (bei Anmeldung und Einrichtung); das Zwischen-Cookie wird gelöscht.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZweiterFaktorAnmeldeAntwort"
        "400":
          description: |
            Codes: `TOTP_NOT_ENABLED`, `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: |
            Codes: `INVALID_CODE`, `INVALID_TWO_FACTOR_COOKIE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/auth/two-factor/verify-backup-code:
    post:
      operationId: ersatzcodeVerwenden
      summary: Ersatzcode prüfen (Anmeldung ohne Authenticator)
      tags:
        - Authentifizierung
      security:
        - zweiterFaktorZwischenschritt: []
        - sitzung: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppHerkunft"
      description: |
        Wie `POST /api/auth/two-factor/verify-totp` in der Anmeldung, aber mit einem der zehn Ersatzcodes
        (Format `xxxxx-xxxxx`). Jeder Ersatzcode gilt einmal; derselbe nochmals ergibt 401 `INVALID_BACKUP_CODE`.
        Bei Erfolg entsteht die Sitzung (`Set-Cookie`). `trustDevice` ignoriert der Server.
        Limit: 5 Anfragen je 15 Minuten und Client-IP (429).

        **Rollen.** Alle mit Zwischen-Cookie oder Sitzung; im Betrieb Admins. Statuscodes: 200, 400, 401, 426, 429.
        Bekannte Fehlercodes: 401 `INVALID_BACKUP_CODE`, 401 `INVALID_TWO_FACTOR_COOKIE`,
        400 `BACKUP_CODES_NOT_ENABLED`, 400 `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeAnfrage"
      responses:
        "200":
          description: Ersatzcode richtig, Sitzung ausgestellt.
          headers:
            Set-Cookie:
              description: Neues Session-Cookie; das Zwischen-Cookie wird gelöscht.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZweiterFaktorAnmeldeAntwort"
        "400":
          description: |
            Codes: `BACKUP_CODES_NOT_ENABLED`, `TOO_MANY_ATTEMPTS_REQUEST_NEW_CODE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: |
            Codes: `INVALID_BACKUP_CODE`, `INVALID_TWO_FACTOR_COOKIE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/ich:
    get:
      operationId: ichLesen
      summary: Eigenes Profil mit Einheiten und Teilnehmenden lesen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Das Profil der angemeldeten Person: Anzeigename, Benutzername, Schalter, Kantonsadmin-Kennzeichen,
        Stand des zweiten Faktors und der Einwilligung, die Einheiten mit der Rolle der Person (Kommandant, Stellvertretung, Leitung)
        und die aktiven teilnehmenden Personen, für die das Konto antwortet (Eltern oder die Person selbst). Einheiten und Personen tragen ihr `abzeichen` (`null` ohne Rang).
        Jede teilnehmende Person nennt Name und Typ ihrer Einheit (`einheitName`, `einheitTyp`), auch wenn die Liste `einheiten` leer ist (reine Eltern).
        Nie enthalten sind E-Mail, Bremsfelder, Sperrstatus, Ablauf des Startpassworts sowie Geheimnisse
        und Codes des zweiten Faktors.

        Inaktive teilnehmende Personen fehlen. `pushAnmeldungen` steht nur bei Personen mit einer Rolle in einer Einheit.

        **Offen bleibt diese Route auch bei offenem Pflichtwechsel des Passworts (`mussPasswortAendern: true`) und ohne gültige
        Einwilligung (`einwilligung: false`).** Alle anderen Routen unter `/api/v1` ausser `/api/v1/einwilligung` und `/api/v1/admin/*`
        antworten dann mit 403.

        **Rollen.** Alle angemeldeten Personen, auch ohne zweiten Faktor.
        Statuscodes: 200, 401 (ohne Sitzung, deaktiviert, Konto gelöscht), 426.
      responses:
        "200":
          description: Das eigene Profil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IchProfil"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    patch:
      operationId: ichAendern
      summary: Eigene Push-Schalter und Telefonnummer ändern
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Ändert nur die eigenen Schalter und die eigene Telefonnummer; die Person kommt immer aus der Sitzung.
        Mindestens ein Feld muss im Body stehen. Der Body ist strikt: Jedes andere Feld ergibt 400, ebenso ein
        leerer Body oder ein Schalter, der kein Boolean ist.

        **Push-Schalter.** `pushProgramme` (Pushes zu Programmen) ist ein Boolean und standardmässig an. Die API wertet ihn bei jedem Versand aus; das Push-Token bleibt dabei bestehen. Ein Push trägt als Daten `typ` (`programm`) und `id` (Programm-ID), woraus die App das Ziel öffnet. Der Schalter gilt für Erinnerungen, Absagen und Änderungen von Programmen (Android-Kanal `termine`). Absage und Änderung tragen nie Titel oder Namen: Titel «Termin abgesagt» bzw. «Termin geändert», Text «In Fire-Response». Die Absage erreicht alle Aktiven der Einheit, die Änderung nur, wer schon geantwortet hat.

        **Anmelde-Push.** `pushAnmeldungen` (Push an Kommando und Leitende bei An- und Abmeldung für ein Programm) ist ein Boolean und standardmässig an. `GET /api/v1/ich` gibt den Schalter nur Personen mit einer Rolle in einer Einheit zurück; setzen lässt er sich von jeder Person, ohne Wirkung ohne Rolle.

        **Telefonnummer.** Freiwillig, nur für Kommandant und Stellvertretungen (sie sind die Kontakte). `telefon` ist ein Text mit Ziffern und den Zeichen
        `+ ( ) / . -` sowie Leerzeichen (6 bis 30 Zeichen, nach dem Trimmen); sonst 400. Ein leerer Text oder `null`
        entfernt die Nummer. Eine Nummer speichern darf nur, wer Kommandant oder Stellvertretung ist (sonst 403); entfernen darf sie
        jede Person, auch eine, die die Rolle verloren hat.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts oder fehlender Einwilligung (403); die Nummer nur
        Kommandant und Stellvertretungen. Statuscodes: 204, 400, 401, 403, 426.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IchEinstellungen"
      responses:
        "204":
          description: Gespeichert; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/ich/bild:
    put:
      operationId: ichBildSetzen
      summary: Eigenes Profilbild hochladen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Setzt das Profilbild der angemeldeten Person; ein vorhandenes Bild wird ersetzt. Jede Person lädt nur ihr
        eigenes hoch. Teilnehmende Personen ohne eigenes Konto haben nie ein Bild.

        **Body.** Das Bild selbst als Bytes, kein JSON und kein Multipart. Erlaubt sind JPEG, PNG und WebP; der Typ
        ergibt sich aus den ersten Bytes der Datei, nie aus Dateiendung oder `Content-Type`. Höchstens 5 MiB
        (5 242 880 Bytes) und höchstens 16 Millionen Pixel; grössere Bilder verkleinert die App vor dem Senden.
        Wählt die App vorher einen quadratischen Ausschnitt, schneidet der Server nicht noch einmal die Mitte zu.

        **Verarbeitung.** Der Server liest das Bild, dreht es nach der EXIF-Angabe, schneidet es quadratisch aus der
        Mitte zu, skaliert es auf 256 × 256 Pixel und speichert es als JPEG. Dabei gehen alle Metadaten verloren
        (EXIF, Aufnahmeort, Farbprofil); das Original wird nicht gespeichert. Transparenz wird weiss.

        **Begrenzung.** Höchstens 10 Uploads je Person in 10 Minuten, fehlgeschlagene eingeschlossen; der Zähler liegt
        im Arbeitsspeicher des Servers.

        Danach liefert `GET /api/v1/ich` unter `bildUrl` den neuen Pfad.

        **Barrierefreiheit.** Das Bild trägt keinen Text. Die App zeigt es als Zierde neben dem Namen (leerer
        Alternativtext) und nennt in der Bedienung nur den Namen; ein Bild darf nie allein die Information tragen.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403).
        Statuscodes: 204, 401, 403, 413, 415, 426, 429.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Gespeichert; kein Body.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "413":
          description: Das Bild ist grösser als 5 MiB (code `ZU_GROSS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "415":
          description: Kein JPEG, PNG oder WebP, kein lesbares Bild oder zu viele Pixel (code `BILD_FORMAT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: ichBildLoeschen
      summary: Eigenes Profilbild löschen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Löscht das Profilbild der angemeldeten Person, jederzeit. Ohne Bild ebenfalls 204. Mit dem Konto verschwindet
        das Bild von selbst, auch wenn ein Admin die Person löscht. Deaktiviert ein Admin die Person
        (`POST /api/v1/admin/personen/{id}/deaktivieren`), löscht der Server das Bild ebenfalls; Aktivieren bringt es nicht
        zurück, die Person lädt dann ein neues hoch.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403).
        Statuscodes: 204, 401, 403, 426.
      responses:
        "204":
          description: Gelöscht oder nie vorhanden; kein Body.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/personen/{id}/bild:
    get:
      operationId: personBildLesen
      summary: Profilbild einer Person lesen
      tags:
        - Profil
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: id
          in: path
          required: true
          description: ID der Person (`id` eines Kontakts oder die eigene).
          schema:
            type: string
            format: uuid
      description: |
        Liefert das Profilbild als JPEG, 256 × 256 Pixel. Die Adresse steht als `bildUrl` bei den Kontakten und in `GET /api/v1/ich`; die App ruft sie mit der Sitzung auf und baut sie nicht selbst.
        Das Bild ist nie öffentlich: ohne Sitzung 401.

        **Cache.** Die Antwort trägt `Cache-Control: private, no-store` (auch die Ablehnung) und
        `X-Content-Type-Options: nosniff`. Das Bild gehört nicht in einen Zwischenspeicher auf der Platte; die App
        hält es höchstens im Arbeitsspeicher der laufenden Ansicht. Der Wert `v` in `bildUrl` ändert sich mit
        jedem neuen Bild, ändert aber nichts an der Antwort.

        **Rollen.** Wer eine Person mit Namen sieht, sieht auch ihr Bild, sonst niemand: die Person selbst, das Konto des Kantonsadmins für alle,
        Kommando und Leitende für alle Rollen ihrer Einheiten, Eltern und Teilnehmende für Kommandant und Stellvertretungen ihrer Einheiten
        (die Kontakte). Für alle anderen, für Personen ohne Bild und für unbekannte Personen ist die Antwort 404, ohne Unterschied.
        Statuscodes: 200, 400, 401, 403, 404, 426.
      responses:
        "200":
          description: Das Bild.
          headers:
            Cache-Control:
              description: Immer `private, no-store`.
              schema:
                type: string
                const: private, no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/push-token:
    put:
      operationId: pushTokenRegistrieren
      summary: Push-Token des Geräts für die aktuelle Sitzung hinterlegen
      tags:
        - Push
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      description: |
        Hinterlegt das Push-Token des Geräts bei der aktuellen Sitzung. Pro Sitzung gibt es ein Token: Ein neues
        ersetzt das alte derselben Sitzung. Schickt eine andere Sitzung dasselbe Token (geteiltes Handy), zieht es
        zu dieser Sitzung um und gehört nicht mehr der früheren Person. Mit dem Ende der Sitzung (Abmelden,
        Löschen des Kontos) verschwindet auch das Token.

        Der Body ist strikt: Fremde Felder (`userId`, `sessionId`), ein Token in falscher Form, eine andere
        Plattform oder ein leerer Body ergeben 400. Das Token ist ein FCM-Registrierungstoken: 20 bis 512 Zeichen aus Buchstaben, Ziffern
        und `_ : . -`. Die Form `ExponentPushToken[…]` aus der früheren Expo-Anbindung ergibt 400.

        **Rollen.** Alle angemeldeten Personen ausser bei offenem Pflichtwechsel des Passworts (403).
        Statuscodes: 204, 400, 401, 403, 426.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenAnfrage"
      responses:
        "204":
          description: Hinterlegt; kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
  /api/v1/programme:
    get:
      operationId: programmeAuflisten
      summary: Programme eines Zeitfensters auflisten
      tags:
        - Programme
      description: |
        Liefert alle für die angemeldete Person sichtbaren Programme, die das Fenster `von` bis `bis` berühren,
        mit dem Namen der Einheit. Das Fenster zählt in Schweizer Kalendertagen und ist beidseitig inklusive:
        Ein mehrtägiges Programm (Lager) erscheint an jedem seiner Tage. Ist `von` nach `bis`, ist die Liste leer
        (kein Fehler). Sortiert nach Beginn (ganztägige Programme ab 00:00 Schweizer Zeit ihres ersten Tages),
        bei Gleichstand nach `id`.

        Wer aufrufen darf: jede angemeldete Person. Sichtbar sind die Programme der Einheiten, in denen die Person
        Kommandant, Stellvertretung oder Leitung ist oder für die sie als Eltern oder selbst eine aktive teilnehmende Person angemeldet hat;
        das Konto des Kantonsadmins sieht alle Einheiten. Die App schickt nie eine Einheit mit: Der Server leitet sie aus dem Konto ab.

        Jeder Eintrag trägt `anmeldungAb`, den Schweizer Kalendertag, ab dem sich anmelden lässt (`ANMELDEFENSTER_TAGE` Tage
        vor dem Beginn, Standard 42). Spätere Programme sind sichtbar; die App zeigt dort «Anmeldung ab <Datum>».
        `teilnahmeOffen` sagt, ob sich jetzt antworten lässt (aktiv, nicht begonnen, Fenster offen).
        `anmeldbar` ist immer `true` und nur noch für Apps da, die das Feld lesen. Termine, die die Verwaltung auf «nur Leitende» gestellt hat, fehlen für Eltern und Teilnehmende in Liste und Detail (404).

        Statuscodes: 200 Erfolg; 400 `von` oder `bis` fehlt, ist kein gültiges Datum `JJJJ-MM-TT`, beginnt mit Jahr
        0000 oder es gibt unbekannte Query-Parameter; 401 keine gültige Sitzung (auch deaktiviertes Konto);
        403 das Konto muss zuerst das Passwort ändern oder der Einwilligung zustimmen;
        426 App-Version zu alt; 429 zu viele Anfragen.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: von
          in: query
          required: true
          description: Erster Tag des Fensters (inklusive), Schweizer Kalendertag.
          schema:
            type: string
            format: date
            example: 2027-03-01
        - name: bis
          in: query
          required: true
          description: Letzter Tag des Fensters (inklusive), Schweizer Kalendertag.
          schema:
            type: string
            format: date
            example: 2027-03-31
      responses:
        "200":
          description: Sichtbare Programme im Fenster, möglicherweise leer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammListe"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}:
    get:
      operationId: programmLesen
      summary: Ein Programm mit den Teilnahmen der eigenen Personen lesen
      tags:
        - Programme
      description: |
        Liefert die Felder des Listeneintrags (mit `teilnehmende` samt Rang-Abzeichen) und zusätzlich `thema`, `info`, `aufgebot`,
        die Kontaktperson des Termins (`kontakt`) und (nur für Kommando und Leitende der Einheit) `eigeneAnmeldung`, das auch der Listeneintrag trägt.
        Die Kontaktperson ist die Kommandantin oder der Kommandant, solange sie oder er nicht «nein» gesagt hat; sonst die erste
        Stellvertretung ohne «nein»; haben alle «nein» gesagt, wieder die Kommandantin oder der Kommandant. «Offen» ist keine Absage.
        Die Telefonnummer des Kontakts sehen nur Eltern und Teilnehmende mit aktiver Person in der Einheit, sonst ist `telefon` `null`.

        Wer aufrufen darf: jede angemeldete Person, für die das Programm sichtbar ist (Regeln wie bei der Liste).
        Ein Programm, das die Person nicht sieht oder das es nicht gibt, ist 404.

        Statuscodes: 200, 400 (`id` keine UUID), 401, 403 (Pflichtwechsel des Passworts oder Einwilligung offen), 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      responses:
        "200":
          description: Das Programm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammDetail"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/teilnahmen:
    get:
      operationId: teilnahmenUebersicht
      summary: Anmeldungen eines Programms lesen
      tags:
        - Programme
      description: |
        Kommando, Leitende und das Konto des Kantonsadmins sehen alle aktiven teilnehmenden Personen der Einheit mit ihrer
        Antwort (`ja`, `nein`, `offen`) und ihrem Abzeichen und die Rollen der Einheit (Kommandant zuerst, dann Stellvertretungen nach Reihenfolge, dann Leitende)
        mit ihrer eigenen Anmeldung und ihrem Abzeichen. Eltern und Teilnehmende sehen nur ihre eigenen Personen und keine Leitenden.
        Eine Person, die das Programm sieht, aber weder eine Rolle noch eine eigene teilnehmende Person in der Einheit hat, bekommt 403.

        Statuscodes: 200, 400, 401, 403, 404 (Programm unbekannt oder in keiner sichtbaren Einheit), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      responses:
        "200":
          description: Zahlen und Listen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeilnahmenUebersicht"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/leitung:
    put:
      operationId: leitungAnmelden
      summary: Eigene Anmeldung als Leitung melden oder ändern
      tags:
        - Programme
      description: |
        Meldet die eigene Teilnahme als Kommandant, Stellvertretung oder Leitung der Einheit des Programms an oder ab.
        Die Person kommt aus der Sitzung. Das Konto des Kantonsadmins, Eltern und Teilnehmende bekommen 403, wer die Einheit nicht sieht 404.

        Reihenfolge der Prüfung: Eingabe (400); Programm nicht sichtbar (404); keine Rolle in der Einheit (403);
        Programm schon begonnen (409, Code `PROGRAMM_BEGONNEN`); Anmeldefenster noch nicht offen (409, Code
        `ANMELDEFENSTER_NICHT_OFFEN`). Statuscodes: 204, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammAntwort"
      responses:
        "204":
          description: Anmeldung gespeichert. Kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Programm hat schon begonnen (`PROGRAMM_BEGONNEN`) oder die Anmeldung öffnet erst später
            (`ANMELDEFENSTER_NICHT_OFFEN`, die Meldung nennt den Tag).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              examples:
                begonnen:
                  value:
                    code: PROGRAMM_BEGONNEN
                    message: Das Programm hat schon begonnen.
                fensterZu:
                  value:
                    code: ANMELDEFENSTER_NICHT_OFFEN
                    message: Die Anmeldung öffnet am 23.01.2027.
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system:
    get:
      operationId: holeAdminSystem
      summary: Zustand der API und Bestand
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Liefert Zahlen für die Übersicht der Verwaltung: Prozess (Node-Version, Laufzeit, Speicher, Verzögerung der Ereignisschleife), Datenbank (erreichbar, Antwortzeit, Verbindungen), Bestand und einige Umgebungs-Flags.

        Die Antwort enthält nie Werte aus der Umgebung, Hosts, Adressen, Schlüssel oder Namen. Ist die Datenbank nicht erreichbar, antwortet die Route trotzdem mit 200 und `datenbank.erreichbar: false`.

        Statuscodes: 200 bei Erfolg. 401. 403 für alle anderen Konten (und ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`). 426.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Zustand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystem"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system/requests:
    get:
      operationId: holeAdminSystemRequests
      summary: Zahlen zu den Anfragen an die API
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Liefert Zähler und Dauern der Anfragen seit dem Start der API (höchstens die letzten 24 Stunden, in Minuten-Eimern im Arbeitsspeicher). Nach einem Neustart ist alles leer.

        Erfasst werden nur Methode, Routenmuster (nie der konkrete Pfad), Statuscode und Dauer; keine Query, kein Body, keine Header, keine IP-Adressen und keine Personen. Die Abrufe dieser beiden System-Routen und die statischen Dateien unter `/admin` zählen nicht mit. Dauern (`p50Ms`, `p95Ms`) sind die obere Grenze der Dauerklasse, in der das Quantil liegt (Klassen bis 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000 ms); `null` ohne Anfragen. Die Zähler je Route gelten seit dem Start.

        Statuscodes: 200 bei Erfolg. 401. 403 für alle anderen Konten (und ohne zweiten Faktor, Code `ZWEITER_FAKTOR_FEHLT`). 426.
      tags:
        - Verwaltung
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Zähler und Dauern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemRequests"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/programme/{id}/teilnahmen/{teilnehmendeId}:
    put:
      operationId: teilnahmeSetzen
      summary: Teilnahme einer Person melden oder ändern
      tags:
        - Programme
      description: |
        Setzt die Antwort «ja» oder «nein» für eine teilnehmende Person an einem Programm; eine bestehende Antwort wird
        überschrieben. Ohne gespeicherte Antwort gilt «offen» (`status` = `null` im Programm). Es gibt kein
        Zurücksetzen auf «offen».

        Wer aufrufen darf: nur Eltern der Person oder die Person selbst (Konto in `teilnehmende_konto`). Kommando, Leitende und
        das Konto des Kantonsadmins antworten nicht für andere; für sie und für alle anderen Konten sind fremde Personen 404, auch in
        derselben Einheit. Das Programm muss in einer sichtbaren Einheit liegen und die Person dort angemeldet sein.

        Setzt der Aufruf die Antwort neu oder ändert er sie, geht ein Push an Kommando und Leitende der Einheit
        (aktives Konto, `pushAnmeldungen` an), ausser an die Person, die selbst aufruft:
        Titel «Neue Anmeldung» bei «ja», «Neue Abmeldung» bei «nein», Text «In Fire-Response» (Android-Kanal `anmeldungen`), ohne Programm und ohne Namen. Bleibt der
        Wert gleich, geht kein Push hinaus. Ein Fehler beim Push lässt den Aufruf nicht scheitern.

        Reihenfolge der Prüfung: Eingabe (400); Programm nicht sichtbar oder Person nicht die eigene (404, ohne Unterscheidung);
        inaktive Person (403); Programm abgesagt oder begonnen (409, `PROGRAMM_GESCHLOSSEN`); Anmeldefenster noch nicht
        offen (409, `ANMELDEFENSTER_NICHT_OFFEN`). Zwei Elternteile: Die letzte Antwort gilt.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/ProgrammIdPfad"
        - $ref: "#/components/parameters/ProgrammTeilnehmendeIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammAntwort"
      responses:
        "204":
          description: Teilnahme gespeichert. Kein Body.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          description: |
            Das Programm ist abgesagt (Status nicht «aktiv») oder hat schon begonnen (`PROGRAMM_GESCHLOSSEN`), oder die
            Anmeldung öffnet erst später (`ANMELDEFENSTER_NICHT_OFFEN`, die Meldung nennt den Tag).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
              examples:
                geschlossen:
                  value:
                    code: PROGRAMM_GESCHLOSSEN
                    message: Das Programm ist abgesagt oder hat schon begonnen. Die Teilnahme lässt sich nicht mehr ändern.
                fensterZu:
                  value:
                    code: ANMELDEFENSTER_NICHT_OFFEN
                    message: Die Anmeldung öffnet am 23.01.2027.
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/einheiten/{einheitId}/kontakt:
