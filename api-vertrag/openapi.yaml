  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: |
        Version der App im Format `x.y.z` (drei Zahlen, z. B. `1.2.0`). Gilt für alle Pfade unter `/api/*`
        (nicht für `/health`, die Seiten und `/.well-known`). Ist die Version älter als der Mindeststand des
        Servers, antwortet er mit 426 `APP_VERALTET`. Eine Angabe in anderem Format gilt als zu alt (426).
        Ohne den Header läuft die Anfrage weiter. Die App schickt den Header immer.

        **Drosselung.** Der Server zählt Anfragen je Absender-Adresse (`X-Forwarded-For` des Edge-Caddys) und Minute. Über `/api/v1/*` und `/admin/*`
        sind es 600, für `GET /api/v1/datenschutz` und die Seiten (`/datenschutz`, `/nutzungsbedingungen`, `/konto-loeschen`, `/support`) zusammen 30.
        Danach antwortet jede dieser Routen mit 429 `ZU_VIELE_ANFRAGEN` und dem Header `X-Retry-After` (Sekunden bis zum nächsten Fenster); die App wartet so lange.
        `/health` und `/api/auth/*` (eigene Limits, siehe dort) zählen nicht hier mit. Die 429 steht nicht bei jeder Operation einzeln.
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
        example: 1.2.0
    AppHerkunft:
      name: Origin
      in: header
      required: false
      description: |
        Herkunft der App für die Schutzprüfung von better-auth. Jeder POST an `/api/auth/*`, der ein
        `Cookie` mitschickt, braucht eine vertraute Herkunft, sonst 403 (`MISSING_OR_NULL_ORIGIN` oder
        `INVALID_ORIGIN`). Vertraut ist das App-Schema `fireresponse://` (auch mit Host und Port, z. B.
        `fireresponse://192.0.2.1:8081` für Entwicklungs-Builds). Statt `Origin` genügt `expo-origin` mit demselben
        Wert: Der Server übernimmt ihn als `Origin`, wenn `Origin` fehlt. Reine Anmeldungen ohne Cookie
        brauchen keine Herkunft.
      schema:
        type: string
        example: fireresponse://
    ProgrammIdPfad:
      name: id
