      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminKonflikt"
    ZuVieleAnfragen429:
      description: Zu viele Anfragen (code ZU_VIELE_ANFRAGEN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
