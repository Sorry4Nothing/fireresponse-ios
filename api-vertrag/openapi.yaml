        bezirke:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
    AdminEinheitListe:
      type: object
      required: [einheiten]
      properties:
        einheiten:
          type: array
          items:
            type: object
            required:
              [
                id,
                name,
                typ,
                bezirkId,
                bezirk,
                logoUrl,
                kommandant,
                teilnehmende,
                rolle,
                lodurHinterlegt,
                syncOkAm,
                syncFehler,
              ]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              typ:
                type: string
                enum: [jf, kf]
              bezirkId:
                type: string
                format: uuid
              bezirk:
                type: string
                description: Name des Bezirks.
              logoUrl:
                type: [string, "null"]
