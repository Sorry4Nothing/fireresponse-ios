        Routen unter `/api/v1` ausser `GET /api/v1/ich`, dieser Route und `/api/v1/admin/*` mit 403 `EINWILLIGUNG_FEHLT`;
        Passwortwechsel und Abmelden laufen über `/api/auth/*` und bleiben offen.

