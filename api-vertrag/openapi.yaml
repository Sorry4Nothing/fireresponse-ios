  /api/v1/admin/einheiten/{einheitId}/logo:
    get:
      operationId: leseAdminEinheitLogo
      summary: Logo der Einheit für die Verwaltung lesen
      tags:
        - Verwaltung
      description: |
        Das gespeicherte, bereinigte Logo (PNG oder SVG), das die Verwaltung anzeigt. Die Adresse steht als `logoUrl` in der Liste der Einheiten. Gleiche Antwort-Header wie bei `GET /api/v1/einheiten/{einheitId}/logo`; die Einwilligung der App gilt hier nicht.

        Wer aufrufen darf: Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Ohne Logo 404. Statuscodes: 200, 400, 401, 403, 404, 426.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "200":
          description: Das Bild.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
    put:
      operationId: setzeAdminEinheitLogo
      summary: Logo der Einheit hochladen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Der Body ist das Bild selbst, SVG oder PNG, höchstens 500 KB (sonst 413); der Typ ergibt sich aus den Bytes, nie aus dem Header. Quadratisch, bei PNG mindestens 128 × 128 und höchstens 4000 × 4000 Pixel.

        Der Server prüft und bereinigt wie beim Abzeichen eines Rangs (SR-23); gespeichert wird das Ergebnis, nie die Eingabe. Es ersetzt ein früheres Logo. Ein ungültiges Bild ist 415 `LOGO_UNGUELTIG` mit einer deutschen Meldung.

        Statuscodes: 204, 400, 401, 403, 404, 413, 415, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Gespeichert.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "413":
          description: Die Datei ist grösser als 500 KB (code ZU_GROSS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "415":
          description: Die Datei ist kein gültiges, quadratisches SVG oder PNG (code LOGO_UNGUELTIG).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: entferneAdminEinheitLogo
      summary: Logo der Einheit entfernen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Entfernt das Logo; ohne Logo ebenfalls 204.

        Statuscodes: 204, 400, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "204":
          description: Entfernt.
        "400":
