  /api/v1/admin/einheiten:
    get:
      operationId: listeAdminEinheiten
      summary: Einheiten der Verwaltung auflisten
      tags:
        - Verwaltung
      description: |
        Konten der Verwaltung mit zweitem Faktor: Das Konto des Kantonsadmins sieht alle Einheiten, Kommando und Stellvertretungen nur die eigenen.
        Sortiert nach Bezirk und Art.

        Statuscodes: 200, 401, 403 (Leitende, Eltern, Teilnehmende und Konten der Verwaltung ohne zweiten Faktor), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Einheiten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEinheitListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeAdminEinheitAn
      summary: Einheit mit Kommandant/in anlegen
      tags:
        - Verwaltung
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Einheit und Kommandant/in entstehen in einer Transaktion: Scheitert eines von beiden, entsteht nichts.
        Die Kommandantin oder der Kommandant bekommt ein neues Konto mit Startpasswort (7 Tage gültig, Pflichtwechsel beim ersten Login). Es gibt keine Selbstregistrierung.
        Das Startpasswort steht nur in dieser Antwort; die Verwaltung kann es später nicht mehr anzeigen.
        Pro Bezirk gibt es höchstens eine Jugendfeuerwehr und eine Kinderfeuerwehr (409 `EINHEIT_VORHANDEN`). Ein vergebener Benutzername ist 409 `BENUTZERNAME_VERGEBEN` (ohne Unterschied zwischen Gross- und Kleinschreibung). Ein unbekannter Bezirk ist 400.
        Das Kommando braucht den zweiten Faktor für die Verwaltung und richtet ihn selbst ein (`POST /api/auth/two-factor/enable`).

        Statuscodes: 201, 400, 401, 403, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEinheitAnlegen"
      responses:
        "201":
          description: Einheit und Kommando angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEinheitAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/stellvertretungen:
    post:
      operationId: legeAdminStellvertretungAn
      summary: Stellvertretung anlegen
      tags:
        - Verwaltung
      description: |
        Nur Kommando der Einheit und Kantonsadmin (mit zweitem Faktor). Eine Stellvertretung (403) legt keine weitere an. Legt ein neues Konto mit Startpasswort an
        (siehe `POST /api/v1/admin/einheiten`). Ohne `reihenfolge` kommt die neue Stellvertretung ans Ende; eine belegte Position ist 409 `REIHENFOLGE_BELEGT`.
        Die Nummer ist freiwillig; Kommando und Stellvertretungen sind die Kontakte der Einheit.

        Reihenfolge der Prüfung: Eingabe (400); Einheit unbekannt oder unsichtbar (404); kein Recht (403).

        Statuscodes: 201, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStellvertretungAnlegen"
      responses:
        "201":
          description: Stellvertretung angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStellvertretungAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/stellvertretungen/{userId}:
    put:
      operationId: ordneAdminStellvertretung
      summary: Stellvertretung an eine Position setzen
      tags:
        - Verwaltung
      description: |
        Nur Kommando der Einheit und Kantonsadmin. Setzt die Stellvertretung an die Position `reihenfolge`; die übrigen rücken nach, und alle zählen danach lückenlos ab 1.
        Eine zu grosse Zahl heisst: ans Ende. Dieselbe Position ist ein No-op (204). Das Ordnen steht im Audit-Log.

        Statuscodes: 204, 400, 401, 403 (auch Stellvertretungen), 404 (Einheit unsichtbar oder Person keine Stellvertretung der Einheit), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminUserIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStellvertretungOrdnen"
      responses:
        "204":
          description: Geordnet.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: entferneAdminStellvertretung
      summary: Stellvertretung entfernen
      tags:
        - Verwaltung
      description: |
        Nur Kommando der Einheit und Kantonsadmin. Nimmt der Person die Rolle; das Konto bleibt bestehen (die Person ist dann ohne Einheit). Die übrigen behalten ihre Positionen. Das Entfernen steht im Audit-Log.

        Statuscodes: 204, 400, 401, 403 (auch Stellvertretungen), 404 (Einheit unsichtbar oder Person keine Stellvertretung der Einheit), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminUserIdPfad"
      responses:
        "204":
          description: Entfernt.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/leitende:
    post:
      operationId: legeAdminLeitendeAn
      summary: Leitende anlegen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Legt ein neues Konto mit Startpasswort an und gibt ihm die Rolle «Leitung».
        Leitende haben keine Nummer.

        Statuscodes: 201, 400, 401, 403, 404, 409 (`BENUTZERNAME_VERGEBEN`), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNeuesKonto"
      responses:
        "201":
          description: Leitende angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKontoAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/leitende/bestehend:
    post:
      operationId: weiseAdminLeitendeZu
      summary: Bestehendes Konto als Leitung zuweisen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Gibt einem Konto, das schon eine Rolle in einer Einheit hat, zusätzlich die Rolle «Leitung» in dieser Einheit (eine Person in Jugend- und Kinderfeuerwehr mit einem Konto). Kein neues Konto, kein Startpasswort.
        Der Kantonsadmin darf jedes Konto mit einer Rolle zuweisen, Kommando und Stellvertretungen nur eines, das in einer Einheit eine Rolle hat, die sie selbst verwalten. Ein unbekanntes, deaktiviertes oder nicht erlaubtes Konto antwortet gleich (404). Danach gilt das Konto als gemeinsam: Zurücksetzen und Deaktivieren bleiben dem Kantonsadmin.

        Statuscodes: 204, 400, 401, 403, 404, 409 (`ROLLE_GLEICH`), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [benutzername]
              properties:
                benutzername:
                  type: string
      responses:
        "204":
          description: Rolle zugewiesen.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/konten-suche:
    get:
      operationId: sucheAdminKonten
      summary: Bestehende Konten für die Felder «Benutzername» vorschlagen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Liefert höchstens 10 aktive Konten, deren Name oder Benutzername den Suchtext enthält (mindestens 2 Zeichen, Gross- und Kleinschreibung egal). Zurück kommen nur `benutzername` und `name`.
        `fuer=leitung`: Konten mit einer Rolle, die hier noch keine haben (Ziel von `POST .../leitende/bestehend`). `fuer=eltern`: Elternkonten ohne eigene Person (Ziel von `bestehendesKonto`).
        Geltungsbereich wie beim Zuweisen: Das Kommando findet nur Konten aus Einheiten, die es selbst verwaltet, der Kantonsadmin alle. Das Konto des Kantonsadmins erscheint nie.

        Statuscodes: 200, 400, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 64
        - name: fuer
          in: query
          required: true
          schema:
            type: string
            enum: [leitung, eltern]
      responses:
        "200":
          description: Treffer, nach Name sortiert.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [konten]
                properties:
                  konten:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [benutzername, name]
                      properties:
                        benutzername:
                          type: string
                        name:
                          type: string
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
