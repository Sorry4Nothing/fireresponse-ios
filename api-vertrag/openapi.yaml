          format: uuid
        titel:
          type: string
        status:
          type: string
          enum: [aktiv, abgesagt, pruefen]
        ganztaegig:
          type: boolean
        beginn:
          type: [string, "null"]
          format: date-time
        ende:
          type: [string, "null"]
          format: date-time
        tagVon:
          type: [string, "null"]
          format: date
        tagBis:
          type: [string, "null"]
          format: date
        begonnen:
          type: boolean
        einheit:
          $ref: "#/components/schemas/AuswertungEinheitKurz"
    AuswertungTermine:
      type: object
