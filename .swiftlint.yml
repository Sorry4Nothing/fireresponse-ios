included:
  - FireResponse
  - FireResponseTests
excluded:
  - FireResponse/Resources
disabled_rules:
  - identifier_name
  - type_body_length
  - trailing_comma
  - large_tuple
  - static_over_final_class
  - nesting
opt_in_rules:
  - empty_count
  - force_unwrapping
line_length:
  warning: 200
  error: 260
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 600
  error: 900
function_body_length:
  warning: 80
  error: 150
cyclomatic_complexity:
  warning: 15
  error: 25
