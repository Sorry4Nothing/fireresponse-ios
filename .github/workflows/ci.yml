name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Lokale Konfiguration aus der Vorlage
        run: cp Config/Local.example.xcconfig Config/Local.xcconfig
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict
      - name: Build und Tests
        run: |
          xcodebuild test -project FireResponse.xcodeproj -scheme FireResponse \
            -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO
